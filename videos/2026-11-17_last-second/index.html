<style>

<body><div id="stage"><canvas id="c"></canvas>
<div id="title"><div class="a">ВРЕМЯ НИКОГДА НЕ ОСТАНАВЛИВАЛОСЬ.</div><div class="b">ЭТО ТЫ ЗАКОНЧИЛСЯ.</div></div></div>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "./v/postprocessing/EffectComposer.js";
import { RenderPass } from "./v/postprocessing/RenderPass.js";
import { ShaderPass } from "./v/postprocessing/ShaderPass.js";
import { UnrealBloomPass } from "./v/postprocessing/UnrealBloomPass.js";
import { mergeGeometries } from "./v/utils/BufferGeometryUtils.js";

/* ПОСЛЕДНЯЯ СЕКУНДА — детерминированный фильм: всё — функция времени t. window.__seek(t), __duration, __audioWav(). */
const DUR = 43.0;
const q = new URLSearchParams(location.search);
const RW = +(q.get("w") || 1920), RH = +(q.get("h") || 1080);
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, powerPreference: "high-performance" });
renderer.setPixelRatio(1); renderer.setSize(RW, RH, false);
renderer.toneMapping = THREE.NoToneMapping; renderer.outputColorSpace = THREE.LinearSRGBColorSpace;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sm = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };
const lerp = (a, b, x) => a + (b - a) * x;
function rng(seed) { let s = seed | 0; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------------- shared GLSL ---------------- */
const U = { uT: { value: 0 }, uTw: { value: 0 }, uSun: { value: new THREE.Vector3(0.12, 0.075, -1).normalize() }, uCrack: { value: 0 }, uBend: { value: 0 }, uOcean: { value: 0 }, uLift: { value: 0 }, uFrozen: { value: 0 } };
const GL_COMMON = /* glsl */`
uniform float uT, uTw, uCrack, uBend, uOcean, uLift, uFrozen; uniform vec3 uSun;
float h11(float p){ p=fract(p*.1031); p*=p+33.33; p*=p+p; return fract(p); }
float h21(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float h31(vec3 p3){ p3=fract(p3*.1031); p3+=dot(p3,p3.zyx+31.32); return fract((p3.x+p3.y)*p3.z); }
vec3 h33(vec3 p3){ p3=fract(p3*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yxz+33.33); return fract((p3.xxy+p3.yxx)*p3.zyx); }
float n2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y); }
float n3(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm2(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*n2(p); p=p*2.03+17.1; a*=.5; } return s; }
float fbm3(vec3 p){ float s=0., a=.5; for(int i=0;i<4;i++){ s+=a*n3(p); p=p*2.02+11.7; a*=.5; } return s; }
vec3 skyBase(vec3 d){
  float h=d.y; vec3 zen=vec3(.02,.04,.12), mid=vec3(.2,.13,.24), hor=vec3(1.05,.42,.17);
  vec3 c=mix(hor,mid,smoothstep(.0,.16,h)); c=mix(c,zen,smoothstep(.12,.75,h));
  c=mix(c,vec3(.32,.17,.14),smoothstep(.0,-.25,h));
  float s=max(dot(d,uSun),0.);
  c+=vec3(1.5,.7,.3)*pow(s,8.)*.7+vec3(2.6,1.3,.5)*pow(s,120.)*1.6;
  return c;
}
vec3 cosmos(vec3 d){
  vec3 c=vec3(0.);
  float neb=fbm3(d*2.4+3.), neb2=fbm3(d*5.+9.);
  c+=vec3(.25,.08,.4)*pow(neb,3.)*1.6+vec3(.05,.18,.4)*pow(neb2,4.)*2.2;
  float band=exp(-pow(dot(d,normalize(vec3(.3,.8,.5)))*3.,2.)); c+=vec3(.5,.42,.35)*band*pow(fbm3(d*9.),2.)*.9;
  for(int i=0;i<2;i++){ float sc=i==0?140.:320.; vec3 g=floor(d*sc); vec3 r=h33(g); if(r.x>.985-float(i)*.02){ vec3 sp=(g+.2+.6*r)/sc; float dd=length(d-normalize(sp))*sc; c+=mix(vec3(.7,.8,1.2),vec3(1.3,1.,.7),r.y)*exp(-dd*dd*6.)*(2.+r.z*10.)*(i==0?1.:.5); } }
  return c;
}
vec4 crackInfo(vec3 d){ // x: crack line glow, y: revealed (0..1), z: cell id, w: inside cracked zone
  if(uCrack<=0.001) return vec4(0.);
  vec3 o=normalize(vec3(-.25,.55,-.8)); float a=acos(clamp(dot(d,o),-1.,1.));
  float R=uCrack*2.6; if(a>R+.15) return vec4(0.);
  vec3 p=d*5.5; vec3 ip=floor(p), fp=fract(p); float f1=9., f2=9.; vec3 id=vec3(0.);
  for(int k=-1;k<=1;k++)for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){ vec3 b=vec3(i,j,k); vec3 r=b+h33(ip+b)-fp; float dd=dot(r,r); if(dd<f1){f2=f1;f1=dd;id=ip+b;} else if(dd<f2) f2=dd; }
  float e=sqrt(f2)-sqrt(f1); float zone=smoothstep(R+.1,R-.15,a+ (n3(d*12.)-.5)*.25);
  float line=(1.-smoothstep(.0,.035,e))*zone; float hid=h31(id);
  float rev=smoothstep(hid*.9+.12, hid*.9+.32, uCrack*1.25-a*.32)*zone;
  return vec4(line, rev, hid, zone);
}
vec3 skyFull(vec3 d, bool clouds){
  vec4 ci=crackInfo(d); vec3 dd=d;
  if(ci.w>0.) dd=normalize(d+(vec3(h11(ci.z*7.),h11(ci.z*13.),h11(ci.z*3.))-.5)*.035*ci.w); // misaligned mirror shards
  vec3 c=skyBase(dd);
  if(clouds && dd.y>0.){ vec2 p=dd.xz/(dd.y+.06)*.9+vec2(uT*.004,0.); float cl=smoothstep(.48,.82,fbm2(p*1.3)); float s=max(dot(dd,uSun),0.);
    c=mix(c,mix(vec3(.22,.12,.2),vec3(1.9,.85,.4),pow(s,2.5)*.9+.1),cl*.8*smoothstep(.0,.12,dd.y)); }
  c+=vec3(26.,18.,11.)*smoothstep(.99955,.9998,dot(dd,uSun))*(1.-ci.y);
  if(ci.w>0.){ c=mix(c,cosmos(d),ci.y); c*=1.-.25*ci.w*(1.-ci.y); c+=vec3(2.6,2.2,1.9)*ci.x*(1.-ci.y*.6); }
  return c;
}
vec3 warpP(vec3 p){ if(uBend<.001) return p; float Rb=520./uBend; float th=p.z/Rb; return vec3(p.x, Rb-(Rb-p.y)*cos(th), (Rb-p.y)*sin(th)); }
vec3 warpN(vec3 p, vec3 n){ if(uBend<.001) return n; float th=p.z/(520./uBend); return vec3(n.x, n.y*cos(th)+n.z*sin(th), -n.y*sin(th)+n.z*cos(th)); }
vec3 fogCol(vec3 v){ return skyBase(normalize(vec3(v.x,max(v.y,.0)*.35+.03,v.z)))*.75; }
vec3 applyFog(vec3 col, vec3 wp){ vec3 v=wp-cameraPosition; float dist=length(v); float hf=exp(-max(wp.y,0.)/180.); float f=1.-exp(-dist*.00026*(.25+hf)); return mix(col, fogCol(normalize(v)), clamp(f,0.,1.)); }
`;
const VS_HEAD = "uniform float uT, uTw, uCrack, uBend, uOcean, uLift, uFrozen; uniform vec3 uSun;\n";

/* ---------------- sky dome ---------------- */
const city = new THREE.Scene();
const skyMat = new THREE.ShaderMaterial({ uniforms: U, depthWrite: false, side: THREE.BackSide,
  vertexShader: `varying vec3 vD; void main(){ vD=position; vec4 p=projectionMatrix*viewMatrix*vec4(position+cameraPosition,1.); gl_Position=p.xyww; }`,
  fragmentShader: GL_COMMON + `varying vec3 vD; void main(){ gl_FragColor=vec4(skyFull(normalize(vD),true),1.); }` });
const sky = new THREE.Mesh(new THREE.SphereGeometry(5000, 48, 24), skyMat); sky.frustumCulled = false; sky.renderOrder = -10; city.add(sky);

/* ---------------- ground: avenue, crossings, then a transparent ocean ---------------- */
const groundGeo = new THREE.PlaneGeometry(6000, 9000, 60, 360); groundGeo.rotateX(-Math.PI / 2); groundGeo.translate(0, 0, -1500);
const groundMat = new THREE.ShaderMaterial({ uniforms: U, side: THREE.DoubleSide,
  vertexShader: VS_HEAD + `
  vec3 warpP(vec3 p){ if(uBend<.001) return p; float Rb=520./uBend; float th=p.z/Rb; return vec3(p.x, Rb-(Rb-p.y)*cos(th), (Rb-p.y)*sin(th)); }
  varying vec3 vP, vW; void main(){ vP=position; vec3 w=warpP(position); vW=w; gl_Position=projectionMatrix*viewMatrix*vec4(w,1.); }`,
  fragmentShader: GL_COMMON + `varying vec3 vP, vW;
  void main(){
    vec2 p=vP.xz; float ax=abs(p.x); float cz=abs(mod(p.y+45.,90.)-45.);
    bool road=ax<15. || cz<10.; bool walk=!road && (ax<21. || cz<16.);
    vec3 asph=vec3(.035,.034,.036)*(.75+.5*n2(p*.8)); vec3 conc=vec3(.16,.14,.13)*(.8+.4*n2(p*.5));
    vec3 base=road?asph:(walk?conc*1.1:conc*.7);
    if(road){ if(ax<.15 && mod(p.y,12.)<6. && cz>10.) base=vec3(.5,.42,.25); // lane dashes
      if(cz<10. && ax<15. && mod(p.x,1.6)<.8 && abs(cz)<8.) base=vec3(.42,.42,.4); // zebra
      if(ax<10. && abs(ax-5.)<.08 && cz>10.) base=vec3(.38); }
    vec3 nrm=vec3(0,1,0); vec3 V=normalize(vW-cameraPosition);
    float wet=road?.55+.45*smoothstep(.45,.7,n2(p*.15)):.25;
    vec3 Rf=reflect(V,normalize(nrm+vec3(n2(p*3.)-.5,0.,n2(p*3.+9.)-.5)*.05));
    float fr=.03+.97*pow(1.-max(-V.y,0.),5.);
    float sunD=max(dot(nrm,uSun),0.);
    vec3 col=base*(vec3(1.2,.62,.35)*sunD*1.2+vec3(.12,.1,.16))+skyFull(Rf,false)*fr*wet*.7;
    // ocean
    float rr=length(p); float R=uOcean*3200.;
    if(R>0. && rr<R+40.){
      float edge=smoothstep(R,R-30.,rr);
      vec2 q=p*.12; float t=uT*.8;
      vec3 wn=normalize(vec3((n2(q+t*.3)-.5)+(n2(q*2.3-t*.4)-.5)*.6, 3.2, (n2(q+31.-t*.2)-.5)+(n2(q*2.1+t*.5)-.5)*.6));
      vec3 Rw=reflect(V,wn); float fw=.02+.98*pow(1.-max(dot(-V,wn),0.),5.);
      float caus=pow(1.-abs(n2(p*.7+t*.6)*2.-1.),6.)+pow(1.-abs(n2(p*.9-t*.5+5.)*2.-1.),6.);
      vec3 deep=vec3(.0,.06,.09)+vec3(.0,.22,.24)*caus*.5*exp(-rr*.004);
      vec3 water=mix(deep, skyFull(Rw,false), fw);
      water+=vec3(3.,1.6,.8)*pow(max(dot(Rw,uSun),0.),400.)*4.;
      col=mix(col, water, edge);
      col+=vec3(.8,1.6,1.8)*exp(-pow((rr-R)/6.,2.))*.8*step(1.,R);
    }
    gl_FragColor=vec4(applyFog(col,vW),1.);
  }` });
const ground = new THREE.Mesh(groundGeo, groundMat); ground.frustumCulled = false; city.add(ground);

/* ---------------- buildings (instanced boxes, procedural facades) ---------------- */
function buildCity() {
  const R = rng(2026), lots = [];
  for (let x = -1500; x < 1500; x += 34) for (let z = -4200; z < 1600; z += 30) {
    const cx = x + 17, cz = z + 15, ax = Math.abs(cx), czm = Math.abs(((cz + 45) % 90 + 90) % 90 - 45);
    if (ax < 30 || czm < 22) continue;
    if (R() < 0.08) continue;
    const dist = Math.hypot(cx, cz * 0.6), r1 = R();
    let h = (18 + 330 * Math.pow(r1, 2.6)) * (0.45 + 0.9 * Math.exp(-dist / 1400));
    if (R() < 0.012) h = 380 + R() * 160;
    const w = 20 + R() * 11, d = 18 + R() * 10;
    lots.push([cx + (R() - 0.5) * 4, cz + (R() - 0.5) * 3, w, h, d, R(), R() < 0.15 ? 1 : 0]);
  }
  const box = new THREE.BoxGeometry(1, 1, 1); box.translate(0, 0.5, 0);
  const g = new THREE.InstancedBufferGeometry(); g.index = box.index; g.attributes.position = box.attributes.position; g.attributes.normal = box.attributes.normal;
  const a0 = new Float32Array(lots.length * 4), a1 = new Float32Array(lots.length * 4);
  lots.forEach((l, i) => { a0.set([l[0], l[1], l[2], l[3]], i * 4); a1.set([l[4], l[5], l[6], 0], i * 4); });
  g.setAttribute("a0", new THREE.InstancedBufferAttribute(a0, 4)); g.setAttribute("a1", new THREE.InstancedBufferAttribute(a1, 4)); g.instanceCount = lots.length;
  const m = new THREE.ShaderMaterial({ uniforms: U,
    vertexShader: VS_HEAD + `attribute vec4 a0, a1; varying vec3 vW, vL, vN; varying vec4 vS;
    vec3 warpP(vec3 p){ if(uBend<.001) return p; float Rb=520./uBend; float th=p.z/Rb; return vec3(p.x, Rb-(Rb-p.y)*cos(th), (Rb-p.y)*sin(th)); }
    vec3 warpN(vec3 p, vec3 n){ if(uBend<.001) return n; float th=p.z/(520./uBend); return vec3(n.x, n.y*cos(th)+n.z*sin(th), -n.y*sin(th)+n.z*cos(th)); }
    void main(){ vec3 p=position*vec3(a0.z,a0.w,a1.x)+vec3(a0.x,0.,a0.y);
      if(a1.z>.5){ float tp=smoothstep(.82,1.,position.y); p.xz=mix(p.xz,vec2(a0.x,a0.y),tp*.7); }
      vL=p; vN=normal; vS=vec4(a1.y,a0.w,a0.z,a1.x); vec3 w=warpP(p); vW=w; vN=warpN(p,normal);
      gl_Position=projectionMatrix*viewMatrix*vec4(w,1.); }`,
    fragmentShader: GL_COMMON + `varying vec3 vW, vL, vN; varying vec4 vS;
    void main(){
      vec3 n=normalize(vN); vec3 V=normalize(vW-cameraPosition); float seed=vS.x;
      float side=1.-step(.9,abs(n.y)); vec3 ln=vec3(0.); // local face normal from local pos (unwarped)
      vec2 uv=abs(n.x)>abs(n.z)? vec2(vL.z,vL.y) : vec2(vL.x,vL.y);
      float fw=mix(2.6,3.6,h11(seed*19.)), fh=mix(3.3,4.1,h11(seed*7.));
      vec2 cell=floor(uv/vec2(fw,fh)), f=fract(uv/vec2(fw,fh));
      float glassy=step(.35,h11(seed*3.1));
      float win=mix(step(.1,f.x)*step(f.x,.9)*step(.18,f.y)*step(f.y,.88), step(.03,f.x)*step(f.x,.97)*step(.06,f.y), glassy)*side;
      float lit=step(.93,h21(cell+seed*91.))*smoothstep(4.,8.,vL.y)*step(.5,h11(seed*23.));
      vec3 conc=mix(vec3(.07,.065,.06),vec3(.16,.13,.11),h11(seed*5.))*(.85+.3*n2(uv*.3));
      vec3 R=reflect(V,n); float fr=.04+.96*pow(1.-max(dot(-V,n),0.),5.);
      vec3 refl=skyFull(R,false);
      float sunD=max(dot(n,uSun),0.); float amb=.22+.12*n.y;
      vec3 lightc=vec3(1.5,.78,.42)*sunD*1.5+vec3(.2,.16,.27)*amb;
      vec3 glass=mix(vec3(.01,.013,.018), refl*.85, mix(.12,1.,fr))*(.85+.25*h21(cell+seed));
      vec3 col=mix(conc*lightc, glass, win*.92);
      col+=win*lit*vec3(.9,.55,.28)*(.4+.5*h21(cell*3.+seed))*(1.-fr*.8);
      if(n.y>.9) col=conc*.5*lightc+vec3(.04);
      col*=.55+.45*smoothstep(0.,40.,vL.y); // street-level ambient occlusion
      gl_FragColor=vec4(applyFog(col,vW),1.);
    }` });
  const mesh = new THREE.Mesh(g, m); mesh.frustumCulled = false; return mesh;
}
city.add(buildCity());

/* ---------------- people (instanced, procedural walk) ---------------- */
function personGeo() {
  const parts = [], add = (geo, part) => { const n = geo.attributes.position.count; geo.setAttribute("part", new THREE.Float32BufferAttribute(new Float32Array(n).fill(part), 1)); parts.push(geo.toNonIndexed()); };
  let g;
  g = new THREE.CapsuleGeometry(0.19, 0.5, 4, 10); g.scale(1, 1, 0.62); g.translate(0, 1.27, 0); add(g, 0);
  g = new THREE.CylinderGeometry(0.21, 0.26, 0.62, 12); g.scale(1, 1, 0.68); g.translate(0, 0.9, 0); add(g, 0); // coat skirt
  g = new THREE.SphereGeometry(0.108, 12, 10); g.scale(0.92, 1.1, 1); g.translate(0, 1.7, 0); add(g, 1);
  g = new THREE.CylinderGeometry(0.05, 0.055, 0.12, 8); g.translate(0, 1.58, 0); add(g, 1);
  for (const s of [-1, 1]) { g = new THREE.CapsuleGeometry(0.085, 0.72, 3, 8); g.translate(s * 0.095, 0.47, 0); add(g, s < 0 ? 2 : 3); g = new THREE.BoxGeometry(0.11, 0.07, 0.26); g.translate(s * 0.095, 0.035, 0.05); add(g, s < 0 ? 2 : 3); }
  for (const s of [-1, 1]) { g = new THREE.CapsuleGeometry(0.066, 0.54, 3, 8); g.translate(s * 0.235, 1.18, 0); add(g, s < 0 ? 4 : 5); }
  return mergeGeometries(parts);
}
function buildCrowd() {
  const R = rng(77), P = [];
  const ok = (x, z, hd, sp) => { for (let tt = 0; tt <= 5.3; tt += 0.25) { const px = x + Math.sin(hd) * sp * tt, pz = z + Math.cos(hd) * sp * tt; if (Math.hypot(px, pz) < 8.5) return false; } return true; };
  // the scramble crossing around the hero
  for (let i = 0; i < 420; i++) { const x = (R() - 0.5) * 34, z = (R() - 0.5) * 20, dirn = R() < 0.5 ? 1 : -1, hd = (R() < 0.75 ? Math.PI / 2 * dirn : (R() < 0.5 ? 0 : Math.PI)) + (R() - 0.5) * 0.5, sp = 1.1 + R() * 0.6;
    if (ok(x, z, hd, sp)) P.push([x, z, hd, R() * 6.28, sp, 0.92 + R() * 0.16, R(), 0]); }
  // sidewalks of the avenue
  for (let i = 0; i < 2600; i++) { const s = R() < 0.5 ? -1 : 1, x = s * (16 + R() * 5.5), z = -700 + R() * 1000, hd = (R() < 0.5 ? 0 : Math.PI) + (R() - 0.5) * 0.25; P.push([x, z, hd, R() * 6.28, 1.1 + R() * 0.5, 0.92 + R() * 0.16, R(), 0]); }
  // cross-street sidewalks
  for (let i = 0; i < 900; i++) { const k = Math.round((R() - 0.7) * 8), s = R() < 0.5 ? -1 : 1, z = k * 90 + s * (11 + R() * 4.5), x = (R() < 0.5 ? -1 : 1) * (22 + R() * 300), hd = (R() < 0.5 ? 1 : -1) * Math.PI / 2; P.push([x, z, hd, R() * 6.28, 1.1 + R() * 0.5, 0.92 + R() * 0.16, R(), 0]); }
  P.push([0, 0, 0, 0, 0, 1.0, 0.5, 1]); // the hero: still, facing the camera (+z)
  const base = personGeo(), g = new THREE.InstancedBufferGeometry();
  for (const k of ["position", "normal", "part"]) g.setAttribute(k, base.attributes[k]);
  const a0 = new Float32Array(P.length * 4), a1 = new Float32Array(P.length * 4);
  P.forEach((p, i) => { a0.set(p.slice(0, 4), i * 4); a1.set(p.slice(4, 8), i * 4); });
  g.setAttribute("a0", new THREE.InstancedBufferAttribute(a0, 4)); g.setAttribute("a1", new THREE.InstancedBufferAttribute(a1, 4)); g.instanceCount = P.length;
  const m = new THREE.ShaderMaterial({ uniforms: Object.assign({ uHeroLook: { value: 0 } }, U),
    vertexShader: VS_HEAD + `attribute vec4 a0, a1; attribute float part; uniform float uHeroLook; varying vec3 vW, vN; varying float vC, vPart, vHero;
    vec3 warpP(vec3 p){ if(uBend<.001) return p; float Rb=520./uBend; float th=p.z/Rb; return vec3(p.x, Rb-(Rb-p.y)*cos(th), (Rb-p.y)*sin(th)); }
    mat3 rx(float a){ float c=cos(a), s=sin(a); return mat3(1,0,0, 0,c,s, 0,-s,c); }
    void main(){
      float hero=a1.w; float ph=a0.w+uTw*a1.x*5.2; float sw=sin(ph)*(1.-hero);
      vec3 p=position, n=normal;

/* ---------------- timeline ---------------- */
const SH = { A: [0, 6.8], B: [6.8, 8.4], C: [8.4, 16.4], D: [16.4, 23.0], E: [23.0, 30.0], F: [30.0, 34.4], G: [34.4, 38.85], T: [38.85, 43.0] };
const FREEZE = 5.0, FREEZE_END = 5.45;
const worldTime = t => t < FREEZE ? t : t < FREEZE_END ? FREEZE + (t - FREEZE) - (t - FREEZE) ** 2 / (2 * (FREEZE_END - FREEZE)) : FREEZE + (FREEZE_END - FREEZE) / 2;

const title = document.getElementById("title");

function setCam(pos, look, roll = 0, fov = 40) {
  cam.position.set(...pos); cam.up.set(Math.sin(roll), Math.cos(roll), 0); cam.lookAt(...look); cam.fov = fov; cam.updateProjectionMatrix();
}
function frame(t) {
  t = clamp(t, 0, DUR - 1e-4);
  U.uT.value = t; U.uTw.value = worldTime(t); U.uFrozen.value = sm(FREEZE + 0.1, FREEZE_END + 0.25, t);
  U.uCrack.value = sm(11.0, 16.2, t) * 0.85 + sm(16.2, 21, t) * 0.5; U.uLift.value = sm(9.0, 21.0, t);
  U.uOcean.value = Math.pow(sm(16.6, 19.4, t), 1.6); U.uBend.value = Math.pow(sm(18.2, 22.6, t), 1.4) * 1.5;
  grade.uniforms.uT.value = t; grade.uniforms.uUnder.value = 0; grade.uniforms.uFade.value = 0; grade.uniforms.uFlash.value = 0; grade.uniforms.uExp.value = 1;
  title.style.opacity = 0;
  let mode = "city";
  if (t < SH.A[1]) { // aerial dive → street → freeze
    const u = easeOut(clamp(t / 5.25)), P = [[420, 760, 1900], [210, 420, 980], [70, 150, 380], [14, 26, 95], [3.2, 3.2, 26]], L = [[0, 120, -900], [0, 70, -500], [0, 25, -150], [0, 4, -20], [0, 1.45, 0]];

    const s = shake(t, 0.25 * (1 - sm(4.6, 5.3, t)));
    setCam([pos[0] + s[0], pos[1] + s[1], pos[2]], look, Math.sin(t * 0.5) * 0.04 * (1 - u) - 0.08 * (1 - u), lerp(52, 32, sm(0, 5.3, t)));
