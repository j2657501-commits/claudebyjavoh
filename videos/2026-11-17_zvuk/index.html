<script type="module">
import * as THREE from "three";

const DROP = 8.0, BACK0 = 16.0, SNAP = 17.0;

for (let t = DROP; t < BACK0 - 1e-6; t += B) kicks.push(t);

for (let t = 4 + B; t < 7.0; t += 2 * B) claps.push([t, 1]);

for (let b0 = 0; b0 < 2; b0++) for (let h = 0; h < 2; h++) bass.push([b0 * 2 + h * 1, ROOT[b0 % 4], 0.95, 0.8]);

for (let b0 = 0; b0 < 4; b0++) pads.push([b0 * 2, PROG[b0 % 4], 2.0, b0 < 2 ? 0.8 : 0.6]);
for (let b0 = 4; b0 < 8; b0++) pads.push([b0 * 2, PROG[b0 % 4], 2.0, 0.55]);
pads.push([BACK0, [57, 60, 64, 69], 1.0, 0.7], [SNAP, [45, 57, 60, 64, 69, 72], 1.0, 1.0]);
// lead: arpeggio in the build, hook in the drop

// ================= AUDIO (offline, deterministic) =================

// ================= PICTURE =================
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x05050a); scene.fog = new THREE.FogExp2(0x05050a, 0.024);
const camera = new THREE.PerspectiveCamera(56, W / H, 0.05, 400);

const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.7, 0.45, 0.42); composer.addPass(bloom);
composer.addPass(new OutputPass());

scene.add(new THREE.HemisphereLight(0x6a7ac0, 0x1a1028, 1.1));
const key = new THREE.PointLight(0x5ff2ff, 0, 40, 1.6); key.position.set(0, 2.2, -1.6); scene.add(key);
const rimL = new THREE.PointLight(0xff3db4, 30, 40, 1.5); rimL.position.set(-6, 14, -4); scene.add(rimL);
const rimR = new THREE.PointLight(0x7a5cff, 30, 40, 1.5); rimR.position.set(6, 9, 4); scene.add(rimR);

// ---- envelopes from the score ----

// ---- room of tiles ----
const SPK = V(0, 0, -4);

  const r = rng(21);
  const add = (p, n, kind) => tiles.push({ p, n, kind, rnd: [r(), r(), r(), r(), r(), r()] });
  for (let i = 0; i < 14; i++) for (let j = 0; j < 14; j++) add(V(-6.5 + i, 0, -6.5 + j), V(0, 1, 0), 0);
