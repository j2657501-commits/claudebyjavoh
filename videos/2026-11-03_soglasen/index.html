<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Я согласен</title>
<link rel="stylesheet" href="fonts/g.css">
<style>
:root{--ink:#221e1a;--clay:#a93a24;--paper:#f6f0e4;--hl:#ffd83a;--void:#2b231d}
html,body{margin:0;background:#111;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#d8c9ab url(art/wall.jpg);background-size:1024px}

#hud{position:absolute;inset:0;pointer-events:none}

.cap .in{padding:20px 34px 24px;font:700 56px/1.16 'Golos Text',sans-serif;color:var(--ink)}
.cap .w{display:inline-block;white-space:pre}
.cap .k{color:var(--clay)}

<body><div id="stage"><div id="cam"><div id="world"></div><div id="near"></div></div><div id="hud"></div></div>
<script src="sfx.js"></script><script src="camlife.js"></script>
<script>
"use strict";
// ================= helpers (everything is a pure function of t) =================
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)), P=(t,a,b)=>cl((t-a)/(b-a));
const eo=p=>1-Math.pow(1-cl(p),4), eio=p=>{p=cl(p);return p*p*(3-2*p)}, ei=p=>cl(p)*cl(p);
const back=(p,s=1.9)=>{p=cl(p)-1;return 1+p*p*((s+1)*p+s)};
const spr=(dt,amp,f=3.2,z=0.42)=>dt<0||dt>2?0:amp*Math.exp(-z*f*6.283*dt)*Math.sin(f*6.283*Math.sqrt(1-z*z)*dt)*1.6;
const rnd=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const W=document.getElementById('world'), N=document.getElementById('near'), HUD=document.getElementById('hud');
function el(tag,cls,css,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;(parent||W).appendChild(e);return e}
function jag(w,h,seed,amp=5,step=22){const r=rnd(seed),pts=[];const j=()=> (r()-.5)*2*amp;
  for(let x=0;x<w;x+=step)pts.push([x,cl(j()+amp*0.4,0,amp*2)]);
  for(let y=0;y<h;y+=step)pts.push([w-cl(j()+amp*0.4,0,amp*2),y]);
  for(let x=w;x>0;x-=step)pts.push([x,h-cl(j()+amp*0.4,0,amp*2)]);
  for(let y=h;y>0;y-=step)pts.push([cl(j()+amp*0.4,0,amp*2),y]);
  return 'polygon('+pts.map(p=>p[0].toFixed(1)+'px '+p[1].toFixed(1)+'px').join(',')+')'}
const tf=(e,x,y,r=0,sx=1,sy)=>{e.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${r.toFixed(3)}deg) scale(${sx.toFixed(4)},${(sy==null?sx:sy).toFixed(4)})`};
const EV=[]; const ev=(t,n,o)=>EV.push([t,n,o||{}]);
const UPD=[]; // render callbacks
const SVGNS='http://www.w3.org/2000/svg';
// figure silhouettes, viewBox 0 0 60 120 (feet at y=118)
const HEAD=' M16 13 a10 10 0 1 0 20 0 a10 10 0 1 0 -20 0 Z';
const FIG={
 law:'M14 27 Q26 22 38 27 L41 44 L47 60 L44 62 L39 50 L39 72 L35 118 L28 118 L26 80 L24 118 L17 118 L13 72 L13 50 L9 64 L6 62 L11 44 Z'+HEAD+' M41 61 h16 v14 h-16 Z M45 61 v-4 h8 v4 h-2 v-2 h-4 v2 Z',
 you:'M14 27 Q26 22 38 27 L42 44 L45 66 L41 67 L39 50 L39 72 L35 118 L28 118 L26 80 L24 118 L17 118 L13 72 L13 50 L11 67 L7 66 L10 44 Z'+HEAD,
 judge:'M13 27 Q26 21 39 27 L48 118 L4 118 Z'+HEAD,
 suit:'M11 27 Q26 20 41 27 L45 52 L40 72 L37 118 L29 118 L26 82 L23 118 L15 118 L12 72 L7 52 Z'+HEAD,
};
function svgFig(kind,h,fill,parent,opt={}){ // returns wrapper div; feet at wrapper's bottom-centre
  const s=h/120,w=60*s,d=el('div','abs',`width:${w}px;height:${h}px;transform-origin:50% 100%`,parent);
  d.innerHTML=`<svg width="${w}" height="${h}" viewBox="0 0 60 120" style="overflow:visible;display:block">${opt.defs||''}<path d="${FIG[kind]}" fill="${fill}" ${opt.attr||''}/></svg>`;
  d._w=w;d._h=h;return d}
// rough-edge filter + void gradient (shared)
const DEFS=el('div','abs','width:0;height:0',document.body);
DEFS.innerHTML=`<svg width="0" height="0"><defs>
<filter id="rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
<linearGradient id="voidg" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#5a4a3a"/><stop offset="1" stop-color="#8f7d63"/></linearGradient>
<filter id="holefx" x="-15%" y="-15%" width="130%" height="130%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" result="d"/>
<feOffset in="d" dx="1.6" dy="2.6" result="o"/><feComposite in="d" in2="o" operator="out" result="inv"/><feGaussianBlur in="inv" stdDeviation="1.3" result="b"/><feFlood flood-color="#120c06" flood-opacity=".85"/><feComposite in2="b" operator="in" result="sh"/>
<feComposite in="sh" in2="d" operator="in" result="sh2"/><feMerge><feMergeNode in="d"/><feMergeNode in="sh2"/></feMerge></filter></defs></svg>`;
function holeFig(h,parent){return svgFig('law',h,'url(#voidg)',parent,{attr:'stroke="#fffaf0" stroke-width="1.1" stroke-linejoin="round" filter="url(#holefx)"'})}

// paper card
function card(x,y,w,h,rot,seed,parent,cls){const wrap=el('div','abs sh',`width:${w}px;height:${h}px`,parent);const inn=el('div','abs pp '+(cls||''),`width:${w}px;height:${h}px;clip-path:${jag(w,h,seed)}`,wrap);wrap._x=x;wrap._y=y;wrap._r=rot;tf(wrap,x,y,rot);wrap.inn=inn;return wrap}
// evidence clipping from a real screenshot, with marker rects
const CR=JSON.parse(`{"npr_head": {"w": 690, "h": 250}, "npr_hours": {"w": 690, "h": 150, "hours": [[550.5, 35.8, 84.8, 22], [15, 62.8, 210.1, 22]], "days": [[248, 62.8, 240, 22]]}, "npr_bn": {"w": 690, "h": 70, "bn": [[429.1, 33.0, 150.7, 22]]}, "atl": {"w": 545, "h": 310, "words": [[37.2, 118.0, 87.2, 17]], "min": [[68.4, 166.0, 132.5, 17]], "sites": [[128.0, 286.0, 203.7, 17]], "who": [[186.6, 46.0, 297.9, 17]]}, "atl_sites": {"w": 545, "h": 50, "sites": [[128.0, 24.0, 203.7, 17]]}}`);
function clip(name,x,y,dispW,rot,seed,src){
  const c=CR[name],s=dispW/c.w,p=16,w=dispW+2*p,h=c.h*s+2*p;
  const wrap=el('div','abs sh',`width:${w}px;height:${h}px`);
  const inn=el('div','abs',`width:${w}px;height:${h}px;background:#fff;clip-path:${jag(w,h,seed,4,26)}`,wrap);
  el('img','abs',`left:${p}px;top:${p}px;width:${dispW}px;height:${c.h*s}px`,inn).src='art/'+name+'.jpg';
  const mk={};for(const k in c){if(!Array.isArray(c[k]))continue;mk[k]=c[k].map(b=>el('div','mk',`left:${p+b[0]*s-4}px;top:${p+b[1]*s-2}px;width:${b[2]*s+8}px;height:${b[3]*s+4}px`,inn))}
  el('div','pin',`left:${w/2-15}px;top:-12px`,wrap);
  const tg=el('div','tag',`left:${p}px;top:${h+10}px`,wrap,src);
  const o={wrap,inn,s,p,w,h,mk,x,y,rot,c,
    at:(k,i=0)=>{const b=c[k][i];return [x+p+(b[0]+b[2]/2)*s, y+p+(b[1]+b[3]/2)*s]},
    rect:(k,i=0)=>{const b=c[k][i];return [p+b[0]*s,p+b[1]*s,b[2]*s,b[3]*s]}};
  tf(wrap,x,y,rot);return o}
const mark=(o,k,t,t0,dur=0.5)=>o.mk[k].forEach((m,i)=>{const n=o.mk[k].length,a=t0+i*dur/n;m.style.transform=`scaleX(${eio(P(t,a,a+dur/n)).toFixed(3)})`});

// ================= CAPTIONS (screen space, paper strip) =================
const CAPS=[];
function caption(t0,t1,text){const wrap=el('div','cap sh','',HUD);const inn=el('div','in pp','',wrap);
  let on=false;const words=text.split(' ').map(wd=>{const st=wd.startsWith('*');if(st)on=true;const k=on;if(wd.includes('*')&&(!st||wd.indexOf('*',1)>0))on=false;return el('span','w'+(k?' k':''),'',inn,wd.replace(/\*/g,'')+' ')});
  CAPS.push({t0,t1,wrap,inn,words});}
UPD.push(t=>{for(const c of CAPS){const on=t>=c.t0-0.05&&t<c.t1+0.35;c.wrap.style.display=on?'block':'none';if(!on)continue;
  if(!c.clip){c.inn.style.clipPath=jag(c.inn.offsetWidth,c.inn.offsetHeight,7+CAPS.indexOf(c),4,24);c.clip=1}
  const pin=eo(P(t,c.t0,c.t0+0.35)),pout=ei(P(t,c.t1,c.t1+0.3));
  c.wrap.style.opacity=(pin*(1-pout)).toFixed(3);tf(c.wrap,(1-pin)*-60,pout*60,-0.6+(1-pin)*-2.5);
  c.words.forEach((w,i)=>{const p=eo(P(t,c.t0+0.08+i*0.06,c.t0+0.38+i*0.06));w.style.transform=`translateY(${((1-p)*26).toFixed(1)}px)`;w.style.opacity=p.toFixed(3)})}});

// ================= CAMERA =================
const CAMK=[];const key=(t,x,y,z)=>CAMK.push([t,x,y,z]);
const ACC=[];const acc=(t,a)=>ACC.push([t,a]);
function camAt(t){const K=CAMK;if(t<=K[0][0])return K[0].slice(1);
  for(let i=0;i<K.length-1;i++){const a=K[i],b=K[i+1];if(t<=b[0]){const p=eio((t-a[0])/(b[0]-a[0]||1));return [a[1]+(b[1]-a[1])*p,a[2]+(b[2]-a[2])*p,a[3]*Math.pow(b[3]/a[3],p)]}}
  return K[K.length-1].slice(1)}
const drift=(t,ph,f)=>Math.sin(t*f*6.283+ph)+0.5*Math.sin(t*f*1.83*6.283+ph*1.7);
const CAMEL=document.getElementById('cam');
UPD.push(t=>{let [cx,cy,z]=camAt(t);for(const a of ACC)z*=1+spr(t-a[0],a[1]);z*=1+0.012*Math.sin(t*6.283/7.3);
  const dx=5*drift(t,0.3,0.061),dy=3.5*drift(t,1.9,0.083),rot=0.28*drift(t,4.1,0.047);
  W.style.transform=`translate(${(540-cx*z+dx).toFixed(2)}px,${(960-cy*z+dy).toFixed(2)}px) scale(${z.toFixed(5)})`;
  const k=1.45;N.style.transform=`translate(${(540-cx*z*k+dx*1.5).toFixed(2)}px,${(960-cy*z*k+dy*1.5).toFixed(2)}px) scale(${(z*1.15).toFixed(5)})`;
  CAMEL.style.transform=`rotate(${rot.toFixed(3)}deg)`;window.__cam=[cx,cy,z]});
const toScreen=(x,y,t)=>{const [cx,cy,z]=camAt(t);return [540+(x-cx)*z,960+(y-cy)*z,z]};

// ================= RED THREAD =================
const TH=document.createElementNS(SVGNS,'svg');TH.setAttribute('width',5200);TH.setAttribute('height',3200);TH.style.cssText='position:absolute;left:-1400px;top:-900px;overflow:visible;z-index:50;pointer-events:none';
const THREADS=[];
function thread(a,b,t0,t1,sag=1){const p=document.createElementNS(SVGNS,'path');const ax=a[0]+1400,ay=a[1]+900,bx=b[0]+1400,by=b[1]+900,L=Math.hypot(bx-ax,by-ay);
  p.setAttribute('d',`M${ax} ${ay} Q${(ax+bx)/2} ${(ay+by)/2+(80+L*0.07)*sag} ${bx} ${by}`);p.setAttribute('fill','none');p.setAttribute('stroke','#b3261e');p.setAttribute('stroke-width','4.5');p.setAttribute('stroke-linecap','round');
  p.style.filter='drop-shadow(2px 5px 3px rgba(0,0,0,.3))';TH.appendChild(p);THREADS.push({p,t0,t1})}
UPD.push(t=>{for(const h of THREADS){if(!h.L){h.L=h.p.getTotalLength();h.p.style.strokeDasharray=h.L}h.p.style.strokeDashoffset=(h.L*(1-eio(P(t,h.t0,h.t1)))).toFixed(1)}});

// =====================================================================
// ВСЕ ТАЙМИНГИ ЗДЕСЬ (под озвучку — подставить из voice/words.json)
// =====================================================================
const T={tick:0.3,press:1.2,spit:2.0,count:4.0,res:5.4,who:6.6,words:9.6,min:11.3,rain:12.9,sites:15.2,sum:17.0,sum2:17.8,
  month:19.8,hours:20.6,days:21.1,fill:21.4,usa:24.3,bn:27.6,nobody:30.5,lie:32.4,strike:35.4,rush:37.2,end:39.5,cta:40.0,END:42.2};
const CAPT=[[0.05,1.8,'Ты только что нажал *«Я согласен».*'],[1.9,3.7,'А ты хоть раз это *читал?*'],[3.9,5.2,'Давай посчитаем.'],
  [5.4,8.0,'Исследователи из Карнеги-Меллон прикинули:'],[8.1,10.7,'средняя политика конфиденциальности — *2 500 слов.*'],[10.8,12.5,'Это *10 минут* чтения.'],
  [12.8,16.5,'А таких страниц за год ты встречаешь почти *полторы тысячи.*'],[16.9,19.4,'Итого — *244 часа* в год.'],
  [19.7,21.3,'Это целый *месяц* работы.'],[21.4,24.0,'Просто чтобы прочитать, на что ты согласился.'],
  [24.2,30.1,'Если бы все американцы честно это читали, они теряли бы *781 миллиард* долларов в год.'],[30.4,32.1,'Поэтому никто и *не читает.*'],
  [32.3,36.8,'«Я прочитал и согласен» — самая частая *ложь* в интернете.'],[37.1,39.7,'А ты хоть одно соглашение дочитал *до конца?*'],[39.9,42.2,'Пиши в *комменты.*']];
CAPT.forEach(c=>caption(c[0],c[1],c[2]));

// ================= ЛЕНТА СОГЛАШЕНИЯ (носитель через весь ролик) =================
const RX=400,RY=560,RW=280,RL=9200;
const ribO=el('div','abs',`width:${RW}px;height:${RL}px;transform-origin:50% 0`);tf(ribO,RX,RY);
const ribS=el('div','abs sh',`width:${RW}px;height:${RL}px`,ribO);
const ribI=el('div','abs pp',`width:${RW}px;height:${RL}px;clip-path:${jag(RW,RL,401,4,30)};overflow:hidden`,ribS);
{const F=['Пользователь соглашается','с обработкой персональных данных','включая, но не ограничиваясь,','третьими лицами и партнёрами','в целях улучшения сервиса','без дополнительного уведомления','Компания вправе изменить','настоящие Условия в любое время','продолжая использовать сервис,','вы подтверждаете согласие','файлы cookie и аналогичные','технологии отслеживания','в соответствии с применимым','законодательством','срок хранения данных','определяется Компанией'],r=rnd(4);let h='';
 for(let i=0;i<560;i++){if(i%9===0)h+=`<b>${Math.floor(i/9)+1}.${1+(i%5)}.</b> `;h+=F[Math.floor(r()*F.length)]+(r()<0.25?'. ':' ')}
 el('div','sans',`padding:22px 20px;font-size:15px;line-height:22px;font-weight:500;color:#6a6158;text-align:justify`,ribI,h);
 el('div','abs hand',`left:0;top:${RL-330}px;width:${RW}px;height:300px;background:var(--paper);display:flex;align-items:center;justify-content:center;text-align:center;font-size:56px;line-height:1.02;color:var(--clay)`,ribI,'Конец.<br>Если ты<br>дочитал —<br>ты первый');}
UPD.push(t=>{const p=eo(P(t,T.spit,T.spit+1.7)),L=RL*p;ribO.style.clipPath=`inset(0 -40px ${(RL-L).toFixed(0)}px -40px)`;ribO.style.display=t<T.spit?'none':'block';
  const sw=spr(t-T.spit,2.2,1.4)+0.4*Math.sin(t*1.3);tf(ribO,RX,RY,sw*0.6,1)});
ev(T.spit,'whoosh',{dur:0.9,gain:0.6,size:1.2});ev(T.spit+0.05,'paper',{dur:1.6,gain:0.6});ev(T.spit+0.1,'type',{n:22,rate:16,gain:0.35});

// ================= S1 ТЕЛЕФОН + КНОПКА =================
const ph=el('div','abs sh','width:520px;height:940px');tf(ph,280,-380,-2);
const phI=el('div','abs',`width:520px;height:940px;border-radius:70px;background:#26221e;clip-path:${jag(520,940,501,3,26)}`,ph);
const scr=el('div','abs pp',`left:26px;top:30px;width:468px;height:880px;border-radius:50px;overflow:hidden`,phI);
scr.innerHTML=`<div class="sans" style="padding:70px 34px 0;font-size:36px;font-weight:800;line-height:1.1">Пользовательское<br>соглашение</div>`+
 Array.from({length:11},(_,i)=>`<div style="margin:${i?12:28}px 34px 0;height:10px;border-radius:5px;width:${250+((i*97)%150)}px;background:rgba(60,45,30,.16)"></div>`).join('')+
 `<div class="sans" id="chkrow" style="position:absolute;left:34px;top:560px;display:flex;align-items:center;font-size:34px;font-weight:700"><div id="chk" style="width:46px;height:46px;border:4px solid #221e1a;border-radius:10px;margin-right:18px;display:flex;align-items:center;justify-content:center;font-size:40px;color:#a93a24"></div>Я прочитал и согласен</div>`+
 `<div id="btn" class="sans" style="position:absolute;left:34px;top:680px;width:400px;height:110px;border-radius:55px;background:#a93a24;color:#fff;font-size:44px;font-weight:900;display:flex;align-items:center;justify-content:center">Я СОГЛАСЕН</div>`;
const chk=scr.querySelector('#chk'),btn=scr.querySelector('#btn');
// палец (бумажная вырезка)
const fing=el('div','abs sh','width:200px;height:620px;transform-origin:50% 10%',W);
fing.innerHTML=`<svg width="200" height="620" viewBox="0 0 200 620" style="overflow:visible"><path d="M70 40 Q70 0 100 0 Q130 0 130 40 L136 300 Q190 320 196 420 L200 620 L20 620 L28 430 Q30 330 66 300 Z" fill="#e2a97f" stroke="#b97f58" stroke-width="3"/><path d="M80 30 Q80 10 100 10 Q120 10 120 30 L120 70 Q100 78 80 70 Z" fill="#f6dcc6" opacity=".9"/></svg>`;
const CHK=[280+26+34+23,-380+30+560+23],BTN=[280+26+34+200,-380+30+680+55];
UPD.push(t=>{ // палец: к галочке, тап, к кнопке, нажатие, уходит
  const a=eio(P(t,0,0.28)),b=eio(P(t,0.45,1.1)),c=ei(P(t,1.55,2.1));
  let x=CHK[0]+120+(CHK[0]-CHK[0]-120)*a,y=CHK[1]+260+(CHK[1]-CHK[1]-260)*a;
  x+= (BTN[0]-CHK[0])*b;y+=(BTN[1]-CHK[1])*b;
  const tap=Math.max(spr(t-T.tick,1,3)*0.5,0)+Math.max(spr(t-T.press,1,3),0);
  tf(fing,x-100+c*500,y-14+tap*14+c*900,-14+8*b+c*20,1-0.04*tap);
  chk.textContent=t>=T.tick?'✓':'';const pr=t>=T.press?1-spr(t-T.press,0.07,2.6):1;btn.style.transform=`scale(${(t>=T.press&&t<T.press+0.1?0.93:pr).toFixed(3)})`});
ev(T.tick,'click',{gain:0.6});ev(T.press,'click',{gain:0.9,k:0.8});ev(T.press+0.02,'thud',{gain:0.5,size:0.6});acc(T.press+0.02,0.025);
key(0,540,120,1.05);key(T.press,560,240,1.16);key(T.spit+0.3,540,420,1.0);key(T.spit+1.7,540,880,0.95);key(T.count-0.1,540,1020,1.0);
