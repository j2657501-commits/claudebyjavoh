<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Второй круг</title>
<link rel="stylesheet" href="fonts/g.css">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;margin:0 auto;height:100vh;width:calc(100vh*9/16);max-width:100vw}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
/* Второй круг — бесшовный бесконечный зум сквозь экраны телефонов. Всё — функция времени t (детерминировано).
   window.__seek(t), window.__duration, window.__audioWav() для render.cjs. */
const W = 1080, H = 1920, DUR = 19.2;
const cv = document.getElementById("c"), MX = cv.getContext("2d"); let X = MX;
const OC = document.createElement("canvas"); OC.width = W; OC.height = H; const OX = OC.getContext("2d");
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sm = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };
const lerp = (a, b, x) => a + (b - a) * x;
function rng(seed) { let s = seed | 0; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const spring = (x, k = 9, z = 0.45) => x <= 0 ? 0 : 1 - Math.exp(-z * k * x) * Math.cos(k * Math.sqrt(1 - z * z) * x);

/* ---------- complex affine maps (similarity transforms) ---------- */
const cm = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]];
const ca = (a, b) => [a[0] + b[0], a[1] + b[1]], cs = (a, b) => [a[0] - b[0], a[1] - b[1]];
const cdiv = (a, b) => { const d = b[0] * b[0] + b[1] * b[1]; return [(a[0] * b[0] + a[1] * b[1]) / d, (a[1] * b[0] - a[0] * b[1]) / d]; };
const cpol = (r, th) => [r * Math.cos(th), r * Math.sin(th)];
const comp = (A, B) => ({ w: cm(A.w, B.w), t: ca(cm(A.w, B.t), A.t) });
const ID = { w: [1, 0], t: [0, 0] };
const trn = (x, y) => ({ w: [1, 0], t: [x, y] });
const setT = A => X.setTransform(A.w[0], A.w[1], -A.w[1], A.w[0], A.t[0], A.t[1]);
const scaleOf = A => Math.hypot(A.w[0], A.w[1]);
function screenMap(sc) { const S = cpol(sc.w / W, sc.rot); return { w: S, t: cs([sc.cx, sc.cy], cm(S, [W / 2, H / 2])) }; }
function viewMap(M, f, d) { // level → frame, zooming f of the way into screen M; d = layer depth (parallax)
  const S = M.w, c = cdiv(M.t, cs([1, 0], S)), r = Math.hypot(S[0], S[1]), th = Math.atan2(S[1], S[0]);
  const w = cpol(Math.pow(r, -f * d), -th * f * d); return { w, t: cs(c, cm(w, c)) };
}

/* ---------- drawing helpers ---------- */
function rr(x, y, w, h, r) { X.beginPath(); X.moveTo(x + r, y); X.arcTo(x + w, y, x + w, y + h, r); X.arcTo(x + w, y + h, x, y + h, r); X.arcTo(x, y + h, x, y, r); X.arcTo(x, y, x + w, y, r); X.closePath(); }
function clipOut(sc) { X.beginPath(); X.rect(-6000, -6000, 13000, 13000); X.save(); X.translate(sc.cx, sc.cy); X.rotate(sc.rot); const w = sc.w, h = w * 16 / 9, r = w * 0.09, x = -w / 2, y = -h / 2; X.moveTo(x + r, y); X.arcTo(x, y, x, y + h, r); X.arcTo(x, y + h, x + w, y + h, r); X.arcTo(x + w, y + h, x + w, y, r); X.arcTo(x + w, y, x, y, r); X.closePath(); X.restore(); X.clip("evenodd"); }
function ell(x, y, rx, ry, rot = 0) { X.beginPath(); X.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); }
function glow(x, y, r, col, a) { const g = X.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, "rgba(0,0,0,0)"); X.save(); X.globalCompositeOperation = "lighter"; X.globalAlpha = a; X.fillStyle = g; X.fillRect(x - r, y - r, r * 2, r * 2); X.restore(); }
function lit(base, hot, x, y, r) { const g = X.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, hot); g.addColorStop(1, base); return g; }
function lin(x0, y0, x1, y1, stops) { const g = X.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function cap(x0, y0, x1, y1, w, fill) { X.beginPath(); X.moveTo(x0, y0); X.lineTo(x1, y1); X.lineCap = "round"; X.lineWidth = w; X.strokeStyle = fill; X.stroke(); }
const PHONE = "#9cc8ff";

/* phone body around a screen rect; inside(fn) runs with a transform in screen-local units (origin = screen centre, x right, y down) */
function inScreen(sc, fn) { X.save(); X.translate(sc.cx, sc.cy); X.rotate(sc.rot); fn(sc.w, sc.w * 16 / 9); X.restore(); }
function phoneBody(sc) {
  inScreen(sc, (w, h) => {
    const b = w * 0.045;
    X.shadowColor = "rgba(0,0,0,.55)"; X.shadowBlur = w * 0.12; X.shadowOffsetY = w * 0.04;
    rr(-w / 2 - b, -h / 2 - b, w + 2 * b, h + 2 * b, w * 0.13); X.fillStyle = "#0b0c10"; X.fill();
    X.shadowColor = "transparent";
    X.lineWidth = w * 0.012; X.strokeStyle = lin(-w / 2, -h / 2, w / 2, h / 2, [[0, "#5d6475"], [0.5, "#1c1f27"], [1, "#454b5a"]]); X.stroke();
    rr(w / 2 + b * 0.6, -h * 0.28, w * 0.025, h * 0.12, 3); X.fillStyle = "#2a2e38"; X.fill();
  });
}
function screenGlass(sc, a) { if (a <= 0.001) return; inScreen(sc, (w, h) => { X.save(); rr(-w / 2, -h / 2, w, h, w * 0.09); X.clip(); X.globalAlpha = a; X.fillStyle = lin(-w / 2, -h / 2, w / 2, h / 2, [[0, "rgba(255,255,255,0)"], [0.42, "rgba(255,255,255,0)"], [0.5, "rgba(255,255,255,.22)"], [0.58, "rgba(255,255,255,0)"], [1, "rgba(255,255,255,0)"]]); X.fillRect(-w / 2, -h / 2, w, h); X.restore(); }); }
function island(sc, a) { inScreen(sc, (w, h) => { X.globalAlpha = a; rr(-w * 0.14, -h / 2 + w * 0.04, w * 0.28, w * 0.075, w * 0.04); X.fillStyle = "#000"; X.fill(); X.globalAlpha = 1; }); }

/* a hand holding the phone from below; thumb tip animates (swipe) */
function handBack(sc, skin, sleeve) {
  inScreen(sc, (w, h) => {
    X.fillStyle = sleeve; ell(w * 0.42, h * 0.78, w * 0.42, h * 0.26, -0.5); X.fill();
    X.fillStyle = lit(skin[0], skin[1], 0, h * 0.3, w * 0.9); ell(w * 0.12, h * 0.56, w * 0.5, h * 0.17, -0.25); X.fill();
  });
}
function handFront(sc, skin, thumb) {
  inScreen(sc, (w, h) => {
    const b = w * 0.045;
    for (let i = 0; i < 3; i++) { const y = h * (0.1 + i * 0.105); X.fillStyle = lit(skin[0], skin[1], -w / 2, y, w * 0.25); rr(-w / 2 - b - w * 0.1, y, w * 0.13, h * 0.085, w * 0.05); X.fill(); }
    const bx = w * 0.56, by = h * 0.62, tx = thumb[0] * w, ty = thumb[1] * h, tw = w * 0.16 * thumb[2];
    X.fillStyle = skin[0]; X.beginPath(); X.moveTo(bx + tw * 0.4, by + tw * 0.6); X.quadraticCurveTo(bx + tw * 0.2, (by + ty) / 2, tx + tw * 0.48, ty); X.lineTo(tx - tw * 0.48, ty); X.quadraticCurveTo(bx - tw * 0.9, (by + ty) / 2 + tw, bx - tw * 0.6, by + tw); X.closePath(); X.fill();
    X.fillStyle = lit(skin[0], skin[1], tx, ty, tw * 1.2); ell(tx, ty, tw * 0.5, tw * 0.62, -0.25); X.fill();
    X.fillStyle = "rgba(255,240,235,.35)"; ell(tx - tw * 0.06, ty - tw * 0.22, tw * 0.28, tw * 0.24, -0.25); X.fill();
  });
}
function thumbAt(L, tau) { // swipe: rest (lower right, outside the screen) → drag up across → back to rest
  const s0 = L.swipe, u = clamp((tau - s0) / 0.42), back = sm(s0 + 0.42, s0 + 0.85, tau), down = sm(s0 - 0.25, s0, tau);
  const rest = [0.64, 0.58, 1.05];
  if (tau < s0) return [lerp(rest[0], 0.32, down), lerp(rest[1], 0.32, down), lerp(1.05, 1, down)];
  if (tau < s0 + 0.42) { const e = 1 - Math.pow(1 - u, 2.2); return [lerp(0.32, 0.16, e), lerp(0.32, -0.22, e), 1]; }
  return [lerp(0.16, rest[0], back), lerp(-0.22, rest[1], back), lerp(1, 1.05, back)];
}

/* person seen from behind/above, looking at the phone (over-the-shoulder) */
function personBack(o, part) {
  const { hx, hy, r, side } = o, P = (dx, dy) => [hx + side * dx * r, hy + dy * r];
  const lx = o.light[0], ly = o.light[1];
  // arm reaching the phone
  const s = P(-1.25, 1.55), hand = o.hand;
  if (part === "arm") {
  X.beginPath(); X.moveTo(s[0], s[1]); X.quadraticCurveTo(hand[0] + side * r * 0.9, (s[1] + hand[1]) / 2 + r * 0.9, hand[0], hand[1]); X.lineCap = "round"; X.lineWidth = r * 0.95; X.strokeStyle = lit(o.coat, o.coatLit, lx, ly, r * 4); X.stroke(); return; }
  if (o.pre) o.pre();
  // torso
  X.beginPath(); let p = P(-0.38, 0.62); X.moveTo(...p);
  X.bezierCurveTo(...P(-0.9, 1.0), ...P(-1.55, 1.15), ...P(-1.75, 1.95));
  X.bezierCurveTo(...P(-1.9, 2.6), ...P(-1.7, 4.2), ...P(-1.6, 9));
  X.lineTo(...P(4.5, 9)); X.lineTo(...P(4.5, 1.9));
  X.bezierCurveTo(...P(3.2, 1.25), ...P(1.4, 1.05), ...P(0.42, 0.62)); X.closePath();
  X.fillStyle = lit(o.coat, o.coatLit, lx, ly, r * 5); X.fill();
  if (o.collar) { X.beginPath(); X.moveTo(...P(-0.62, 0.55)); X.quadraticCurveTo(...P(0, 1.05), ...P(0.62, 0.55)); X.quadraticCurveTo(...P(0, 0.85), ...P(-0.62, 0.55)); X.fillStyle = o.collar; X.fill(); }
  if (o.straps) { X.lineWidth = r * 0.28; X.strokeStyle = o.straps; X.beginPath(); X.moveTo(...P(-0.9, 1.0)); X.quadraticCurveTo(...P(-1.1, 2.2), ...P(-0.8, 3.6)); X.moveTo(...P(1.3, 1.1)); X.quadraticCurveTo(...P(1.5, 2.3), ...P(1.2, 3.6)); X.stroke(); }
  // rim light on the inner edge
  X.save(); X.globalCompositeOperation = "lighter"; X.lineWidth = r * 0.07; X.strokeStyle = o.rim || "rgba(140,190,255,.35)";
  X.beginPath(); X.moveTo(...P(-0.5, 0.7)); X.bezierCurveTo(...P(-0.9, 1.0), ...P(-1.55, 1.15), ...P(-1.75, 1.95)); X.stroke(); X.restore();
  // neck, head
  X.fillStyle = o.skinDark; rr(hx - r * 0.38, hy + r * 0.2, r * 0.76, r * 0.55, r * 0.2); X.fill();
  X.fillStyle = lit(o.skin, o.skinLit, ...P(-1.2, 0.6), r * 1.6); ell(hx, hy, r * 0.82, r * 0.98); X.fill();
  const ear = P(-0.8, 0.12); X.fillStyle = lit(o.skin, o.skinLit, ear[0] - side * r * 0.2, ear[1], r * 0.4); ell(ear[0], ear[1], r * 0.16, r * 0.27, side * 0.15); X.fill();
  if (o.hair) o.hair(P, r);
}

/* person facing the camera, eyes down on a phone */
function personFront(o) {
  const { x, y, r } = o, py = y + r * 1.75;
  X.fillStyle = lit(o.body, o.bodyLit, x, py, r * 2.6);
  X.beginPath(); X.moveTo(x - r * 0.45, y + r * 0.7); X.bezierCurveTo(x - r * 1.6, y + r * 1.0, x - r * 2.0, y + r * 1.4, x - r * 2.1, y + r * 3.5); X.lineTo(x + r * 2.1, y + r * 3.5); X.bezierCurveTo(x + r * 2.0, y + r * 1.4, x + r * 1.6, y + r * 1.0, x + r * 0.45, y + r * 0.7); X.closePath(); X.fill();
  X.fillStyle = o.skinDark; rr(x - r * 0.33, y + r * 0.4, r * 0.66, r * 0.5, r * 0.2); X.fill();
  if (o.hairBack) o.hairBack(x, y, r);
  X.fillStyle = lit(o.skin, o.skinLit, x, y + r * 1.3, r * 1.6); ell(x, y, r * 0.78, r * 0.98); X.fill();
  // face: eyes down, brows, nose, mouth
  const blink = o.blink ? 1 : 0;
  X.strokeStyle = "rgba(20,15,25,.75)"; X.lineCap = "round"; X.lineWidth = r * 0.06;
  for (const s of [-1, 1]) { X.beginPath(); X.arc(x + s * r * 0.32, y + r * 0.08, r * 0.14, 0.15 * Math.PI, 0.85 * Math.PI); X.stroke(); if (!blink) { X.fillStyle = "rgba(170,215,255,.9)"; ell(x + s * r * 0.32, y + r * 0.2, r * 0.04, r * 0.025); X.fill(); } }
  X.lineWidth = r * 0.05; for (const s of [-1, 1]) { X.beginPath(); X.moveTo(x + s * r * 0.18, y - r * 0.16); X.quadraticCurveTo(x + s * r * 0.33, y - r * 0.22, x + s * r * 0.5, y - r * 0.12); X.stroke(); }
  X.strokeStyle = "rgba(20,15,25,.35)"; X.beginPath(); X.moveTo(x, y + r * 0.1); X.quadraticCurveTo(x + r * 0.08, y + r * 0.35, x - r * 0.02, y + r * 0.4); X.stroke();
  X.strokeStyle = "rgba(60,20,30,.6)"; X.beginPath(); X.moveTo(x - r * 0.14, y + r * 0.62); X.quadraticCurveTo(x, y + r * 0.58, x + r * 0.14, y + r * 0.62); X.stroke();
  if (o.hair) o.hair(x, y, r);
  // phone (back) + hands + screen light on the face
  X.fillStyle = "#15171d"; rr(x - r * 0.42, py - r * 0.4, r * 0.84, r * 0.62, r * 0.1); X.fill();
  X.fillStyle = o.skin; ell(x - r * 0.45, py + r * 0.12, r * 0.2, r * 0.26); X.fill(); ell(x + r * 0.45, py + r * 0.12, r * 0.2, r * 0.26); X.fill();
  glow(x, py - r * 0.6, r * 1.9, o.glow || PHONE, 0.42);
}

/* the digital clock (seed → payoff) */
function clock(x, y, w, tau) {
  const h = w * 0.53; X.fillStyle = "#08080a"; rr(x, y, w, h, w * 0.08); X.fill();
  X.strokeStyle = "#1d1d22"; X.lineWidth = 4; X.stroke();
  X.font = `900 ${Math.round(w * 0.4)}px 'Golos Text'`; X.textAlign = "center"; X.textBaseline = "middle";
  const on = Math.floor(tau / 0.6) % 2 === 0 || tau < 0;
  X.save(); X.shadowColor = "rgba(255,40,30,.9)"; X.shadowBlur = w * 0.12; X.fillStyle = "#ff3b2f";
  X.fillText("02 47", x + w / 2, y + h * 0.54); if (on) X.fillText(":", x + w / 2, y + h * 0.5); X.restore();
  glow(x + w / 2, y + h / 2, w * 0.9, "#ff3020", 0.16);
}

/* ---------- feed inside a screen: random card → swipe → next world ---------- */
const CARD = [["#ff7a59", "#ffcc4d"], ["#3a7bd5", "#00d2ff"], ["#8e2de2", "#f15bb5"], ["#11998e", "#38ef7d"], ["#f857a6", "#ff5858"], ["#4568dc", "#b06ab3"]];
function feedCard(k, tau) {
  const c = CARD[k % CARD.length]; X.fillStyle = lin(0, 0, W, H, [[0, c[0]], [1, c[1]]]); X.fillRect(0, 0, W, H);
  const R = rng(k * 97 + 5);
  for (let i = 0; i < 6; i++) { const a = R() * TAU, sp = 0.6 + R(); X.fillStyle = `rgba(255,255,255,${0.12 + R() * 0.2})`; ell(W * (0.2 + R() * 0.6) + Math.cos(tau * sp + a) * 120, H * (0.25 + R() * 0.5) + Math.sin(tau * sp * 1.3 + a) * 160, 90 + R() * 200, 90 + R() * 200); X.fill(); }
  X.fillStyle = "rgba(0,0,0,.18)"; rr(W * 0.25, H * 0.36, W * 0.5, W * 0.5, W * 0.12); X.fill();
}
function feedUI(a) {
  if (a <= 0.01) return; X.globalAlpha = a; X.fillStyle = "#fff"; X.strokeStyle = "#fff";
  const ix = 975;
  X.save(); X.translate(ix, 1080); X.beginPath(); X.moveTo(0, 30); X.bezierCurveTo(-70, -20, -30, -70, 0, -30); X.bezierCurveTo(30, -70, 70, -20, 0, 30); X.fillStyle = "#ff2d55"; X.fill(); X.restore();
  X.save(); X.translate(ix, 1290); ell(0, 0, 46, 40); X.fill(); X.beginPath(); X.moveTo(-20, 30); X.lineTo(-34, 58); X.lineTo(6, 36); X.fill(); X.restore();
  X.save(); X.translate(ix, 1490); X.beginPath(); X.moveTo(-40, 30); X.quadraticCurveTo(-30, -20, 15, -20); X.lineTo(15, -45); X.lineTo(50, 0); X.lineTo(15, 45); X.lineTo(15, 20); X.quadraticCurveTo(-20, 15, -40, 30); X.fill(); X.restore();
  X.font = "700 40px 'Golos Text'"; X.textAlign = "center"; X.textBaseline = "middle";
  X.fillText("1,2M", ix, 1160); X.fillText("8 403", ix, 1370); X.fillText("31K", ix, 1570);
  X.textAlign = "left"; X.font = "700 52px 'Golos Text'"; X.fillText("@ещё_одно", 60, 1640);
  X.globalAlpha = a * 0.85; rr(60, 1700, 620, 30, 15); X.fill(); rr(60, 1750, 420, 30, 15); X.fill();
  X.globalAlpha = a * 0.5; X.fillRect(0, 1890, W, 8); X.globalAlpha = a; X.fillRect(0, 1890, W * 0.62, 8); X.globalAlpha = 1;
}

/* ================= WORLDS ================= */
const R0 = rng(11);
const CITY = Array.from({ length: 16 }, (_, i) => ({ x: 70 + i * 26, w: 22 + R0() * 26, h: 80 + R0() * 300, win: Array.from({ length: 14 }, () => R0()) }));
const BOKEH0 = Array.from({ length: 14 }, () => ({ x: 90 + R0() * 340, y: 760 + R0() * 220, r: 10 + R0() * 22, c: R0() < 0.5 ? "#ffbf69" : "#7fb3ff" }));
const DUST = Array.from({ length: 34 }, () => ({ x: R0(), y: R0(), r: 1.5 + R0() * 4, s: 0.2 + R0() * 0.6, p: R0() * TAU }));
const STARS = Array.from({ length: 260 }, () => ({ x: R0() * W, y: R0() * 1150, r: 0.6 + R0() * 2.2, p: R0() * TAU, f: 0.5 + R0() * 2 }));
const RAIN = Array.from({ length: 90 }, () => ({ x: R0(), y: R0(), l: 30 + R0() * 50, s: 1.2 + R0() * 0.8 }));
const DROPS = Array.from({ length: 40 }, () => ({ x: R0(), y: R0(), r: 3 + R0() * 6 }));
const LIGHTS2 = Array.from({ length: 26 }, () => ({ x: R0() * W, y: 120 + R0() * 520, r: 20 + R0() * 50, a: 0.15 + R0() * 0.3 }));
const CRATERS = Array.from({ length: 22 }, () => ({ x: R0() * W, y: 1200 + R0() * 700, r: 20 + R0() * 90 }));
const ridge = (seed, amp, base, n = 5) => { const r = rng(seed), ph = Array.from({ length: n }, () => [r() * TAU, 1 + r() * 7, r()]); return x => base - amp * ph.reduce((s, [p, f, a], i) => s + Math.abs(Math.sin(x / W * f * 1.6 + p)) * (a + 0.3) / (i + 1), 0); };
const RIDGES = [ridge(3, 260, 1150), ridge(7, 300, 1260), ridge(19, 340, 1420)];
const dust = (cx, cy, rad, tau, a, col = "rgba(200,225,255,") => { for (const d of DUST) { const x = cx + (d.x - 0.5) * rad * 2 + Math.sin(tau * d.s + d.p) * 30, y = cy + (d.y - 0.5) * rad * 2 - ((tau * d.s * 40) % 200) + 100; X.fillStyle = col + (a * (0.25 + 0.35 * Math.sin(d.p + tau))).toFixed(3) + ")"; ell(x, y, d.r, d.r); X.fill(); } };
const sway = (L, tau, amp, f, ph = 0) => amp * Math.sin(TAU * f * tau + ph) * (1 - sm(L.T - L.plunge - 0.35, L.T - L.plunge + 0.15, tau));

const SKIN = { a: ["#c98f73", "#f3c7b4"], b: ["#8d5a43", "#d7a48d"], c: ["#e0b49b", "#ffe1d2"], old: ["#cfa894", "#f7ddd1"], glove: ["#cfd2da", "#ffffff"] };

const LEVELS = [
  { // 0 — ты, 02:47, кровать
    T: 2.4, plunge: 1.15, swipe: 0.12, skin: SKIN.a, sleeve: "#262b3a",
    screen: (L, t) => ({ cx: 560 + sway(L, t, 6, 0.4), cy: 1125 + sway(L, t, 8, 0.33, 1), w: 480, rot: -0.07 + sway(L, t, 0.012, 0.3) }),
    bg(L, t) {
      X.fillStyle = lin(0, 0, 0, H, [[0, "#060914"], [1, "#12172c"]]); X.fillRect(-200, -200, W + 400, H + 400);
