<html><head><meta charset="utf-8"><title>Цена молодости</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:auto}</style>
</head><body><canvas id="c"></canvas>
<script>

const W=1080,H=1920,DUR=24.4;
const cv=document.getElementById('c');cv.width=W;cv.height=H;const X=cv.getContext('2d');
function mk(){const c=document.createElement('canvas');c.width=W;c.height=H;return c;}
const bufA=mk(),bufB=mk(),figC=mk(),FX=figC.getContext('2d');
// ---------- math ----------
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,t)=>{const x=clamp((t-a)/(b-a),0,1);return x*x*(3-2*x);};
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const D=Math.PI/180;
function K(t,keys){if(t<=keys[0][0])return keys[0][1];for(let i=1;i<keys.length;i++){if(t<=keys[i][0]){const[a,va]=keys[i-1],[b,vb]=keys[i];return lerp(va,vb,ss(a,b,t));}}return keys[keys.length-1][1];}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const add=(a,b)=>({x:a.x+b.x,y:a.y+b.y}),mul=(a,k)=>({x:a.x*k,y:a.y*k}),P=(x,y)=>({x,y});
function hull(pts){pts=pts.slice().sort((a,b)=>a.x-b.x||a.y-b.y);const cr=(o,a,b)=>(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x);const lo=[],up=[];for(const p of pts){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}for(let i=pts.length-1;i>=0;i--){const p=pts[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}up.pop();lo.pop();return lo.concat(up);}
function smoothPoly(c,pts){const n=pts.length;const m=(a,b)=>P((a.x+b.x)/2,(a.y+b.y)/2);c.beginPath();let s=m(pts[n-1],pts[0]);c.moveTo(s.x,s.y);for(let i=0;i<n;i++){const q=m(pts[i],pts[(i+1)%n]);c.quadraticCurveTo(pts[i].x,pts[i].y,q.x,q.y);}c.closePath();c.fill();}
// ---------- camera ----------
function drift(t,a=1){return{dx:(5*Math.sin(t*.61)+3*Math.sin(t*1.37+1.2))*a,dy:(4*Math.sin(t*.53+2)+2.5*Math.sin(t*1.11))*a,r:.0032*Math.sin(t*.4+.5)*a};}
function cam(c,C,d){const z=1+(C.z-1)*d;c.setTransform(1,0,0,1,0,0);const bz=C.bz||1;c.translate(W/2,H/2);c.scale(bz,bz);c.translate(-(C.bx??W/2),-(C.by??H/2));c.translate(W/2,H/2);c.rotate((C.r||0)*Math.min(d,1));c.scale(z,z);c.translate(-(W/2+(C.cx-W/2)*d),-(H/2+(C.cy-H/2)*d));}
function w2s(C,d,p){const z=1+(C.z-1)*d;const ox=W/2+(C.cx-W/2)*d,oy=H/2+(C.cy-H/2)*d;const q=P(W/2+(p.x-ox)*z,H/2+(p.y-oy)*z),bz=C.bz||1;return P(W/2+(q.x-(C.bx??W/2))*bz,H/2+(q.y-(C.by??H/2))*bz);}
// ---------- figure rig ----------
const PROP={adult:{th:.245,sh:.235,to:.30,nk:.045,hr:.062,leg:.068,arm:.046,ch:.068,bk:.062},boy:{th:.21,sh:.2,to:.29,nk:.04,hr:.088,leg:.075,arm:.05,ch:.07,bk:.065}};
function props(P0){if(P0.kind!=='son')return PROP.adult;const g=P0.g??1,o={};for(const k in PROP.adult)o[k]=lerp(PROP.boy[k],PROP.adult[k],g);return o;}
function rig(F){
  const pr=props(F),h=F.h,dir=F.dir,v=a=>P(dir*Math.sin(a*D),Math.cos(a*D));
  const legs=(F.legs||[[0,0],[0,0]]).map(([th,sh])=>{const k=mul(v(th),pr.th*h),a=add(k,mul(v(th+sh),pr.sh*h));return{k,a};});
  let hip;
  if(F.hipY!=null)hip=P(F.x,F.hipY);else{let my=0;for(const l of legs){my=Math.max(my,l.k.y+pr.leg*h*.5,l.a.y+.022*h);}hip=P(F.x,F.y-my-(F.lift||0));}
  legs.forEach(l=>{l.k=add(hip,l.k);l.a=add(hip,l.a);});
  const lean=F.lean||0,up=P(dir*Math.sin(lean*D),-Math.cos(lean*D)),fw=P(dir*Math.cos(lean*D),Math.sin(lean*D));
  const L=pr.to*h,sho=add(hip,mul(up,L*.93)),neck=add(hip,mul(up,L));
  const ha=lean+(F.head||0),hup=P(dir*Math.sin(ha*D),-Math.cos(ha*D)),hfw=P(dir*Math.cos(ha*D),Math.sin(ha*D));
  const hr=pr.hr*h,hc=add(neck,mul(hup,pr.nk*h+hr*.85));
  const l1=.165*h*(F.kind==='son'?lerp(.85,1,F.g??1):1),l2=.155*h*(F.kind==='son'?lerp(.85,1,F.g??1):1);
  const arms=(F.arms||[[5,10],[-5,10]]).map(A=>{
    if(A.T){const T=A.T,dx=T.x-sho.x,dy=T.y-sho.y;let d=Math.hypot(dx,dy);const b=P(dx/(d||1),dy/(d||1));d=clamp(d,Math.abs(l1-l2)+1,(l1+l2)*.995);const a=(l1*l1-l2*l2+d*d)/(2*d),hh=Math.sqrt(Math.max(0,l1*l1-a*a));const pp=P(-b.y,b.x);const e1=add(add(sho,mul(b,a)),mul(pp,hh)),e2=add(add(sho,mul(b,a)),mul(pp,-hh));const pref=A.pref||P(-dir*.3,1);const s1=(e1.x-sho.x)*pref.x+(e1.y-sho.y)*pref.y,s2=(e2.x-sho.x)*pref.x+(e2.y-sho.y)*pref.y;return{e:s1>=s2?e1:e2,w:add(sho,mul(b,d))};}
    const e=add(sho,mul(v(A[0]),l1));return{e,w:add(e,mul(v(A[0]+A[1]),l2))};});
  return{pr,h,dir,hip,legs,up,fw,L,sho,neck,hc,hr,hup,hfw,arms,v};
}
function drawFig(c,F,col,far){
  const J=rig(F),{pr,h,dir,hip,legs,up,fw,L,sho,neck,hc,hr,hup,hfw,arms}=J;
  c.save();if(F.sx!=null&&F.sx!==1){c.translate(F.x,0);c.scale(F.sx,1);c.translate(-F.x,0);}
  c.lineCap='round';c.lineJoin='round';
  const limb=(pts,w,cc)=>{c.strokeStyle=cc;c.lineWidth=w;c.beginPath();c.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)c.lineTo(pts[i].x,pts[i].y);c.stroke();};
  const foot=(l,cc)=>{c.strokeStyle=cc;c.lineWidth=.04*h;c.beginPath();c.moveTo(l.a.x-dir*.01*h,l.a.y+.005*h);c.lineTo(l.a.x+dir*.06*h,l.a.y+.012*h);c.stroke();};
  const fem=F.kind==='woman';
  const legW=fem?pr.leg*.75:pr.leg;
  // far limbs
  limb([hip,legs[1].k,legs[1].a],legW*h,far);foot(legs[1],far);
  limb([sho,arms[1].e,arms[1].w],pr.arm*h,far);c.fillStyle=far;c.beginPath();c.arc(arms[1].w.x,arms[1].w.y,.024*h,0,7);c.fill();
  c.fillStyle=col;
  // torso
  const T=(u,vv)=>add(add(hip,mul(up,u*L)),mul(fw,vv*h));
  const ch=fem?pr.ch*.95:pr.ch,bk=pr.bk;
  smoothPoly(c,[T(-.05,-.06),T(.3,-.055),T(.7,-bk),T(.95,-.05),T(1.03,-.02),T(1.03,.03),T(.92,.055),T(.72,ch),T(.45,.055),T(.12,.065),T(-.05,.05)]);
  limb([hip,legs[0].k,legs[0].a],legW*h,col);foot(legs[0],col);
  if(fem){const pts=[T(.4,-.065),T(.4,.06),T(0,-.085),T(0,.085)];for(const l of legs){const mid=P((l.k.x*.45+l.a.x*.55),(l.k.y*.45+l.a.y*.55));for(const q of[l.k,mid])for(const s of[-1,1])pts.push(add(q,P(s*.055*h,s*.01*h)));}smoothPoly(c,hull(pts));}
  limb([sho,neck,add(neck,mul(hup,pr.nk*h))],.05*h,col);
  // head
  if(F.scarf){const pts=[];for(let i=0;i<14;i++){const a=i/14*Math.PI*2;pts.push(P(hc.x+Math.cos(a)*hr*1.14,hc.y+Math.sin(a)*hr*1.14));}pts.push(add(neck,add(mul(fw,-.07*h),mul(up,-.04*h))),add(neck,add(mul(fw,.035*h),mul(up,-.02*h))),add(hc,add(mul(hfw,-hr*1.5),mul(hup,-hr*1.3))));smoothPoly(c,hull(pts));}
  c.beginPath();c.arc(hc.x,hc.y,hr,0,7);c.fill();
  const H2=(a,b)=>add(hc,add(mul(hfw,a*hr),mul(hup,b*hr)));
  c.beginPath();const n1=H2(.82,.12),n2=H2(1.17,-.18),n3=H2(.82,-.38);c.moveTo(n1.x,n1.y);c.lineTo(n2.x,n2.y);c.lineTo(n3.x,n3.y);c.fill();
  c.beginPath();const m1=H2(.5,-.55);c.arc(m1.x,m1.y,hr*.45,0,7);c.fill();// jaw
  if(F.doppi){smoothPoly(c,[H2(-.78,.6),H2(.78,.6),H2(.66,1.12),H2(-.66,1.12)]);}
  if(F.beard){c.beginPath();const b=H2(.45,-.68);c.arc(b.x,b.y,hr*.5,0,7);c.fill();}
  if(F.hair){c.beginPath();const b=H2(-.25,.55);c.arc(b.x,b.y,hr*.62,0,7);c.fill();const b2=H2(.35,.7);c.arc(b2.x,b2.y,hr*.38,0,7);c.fill();}
  if(F.cane>0){c.strokeStyle=col;c.lineWidth=.022*h;c.beginPath();const w0=arms[0].w;c.moveTo(w0.x,w0.y-.02*h);c.lineTo(lerp(w0.x,w0.x+dir*.05*h,1),lerp(w0.y,F.y,F.cane));c.stroke();c.beginPath();c.moveTo(w0.x-dir*.03*h,w0.y-.02*h);c.lineTo(w0.x+dir*.01*h,w0.y-.03*h);c.stroke();}
  if(F.hood){const pts=[];for(let i=0;i<14;i++){const a=i/14*Math.PI*2;pts.push(P(hc.x+Math.cos(a)*hr*1.22-hfw.x*hr*.15,hc.y+Math.sin(a)*hr*1.22-hfw.y*hr*.15));}pts.push(add(neck,mul(fw,-.07*h)),add(neck,mul(fw,.03*h)));smoothPoly(c,hull(pts));}
  // near arm
  limb([sho,arms[0].e,arms[0].w],pr.arm*h,col);c.beginPath();c.arc(arms[0].w.x,arms[0].w.y,.024*h,0,7);c.fill();
  c.restore();return J;
}
const SM=document.createElement('canvas');SM.width=270;SM.height=480;const SMX=SM.getContext('2d');const SM2=document.createElement('canvas');SM2.width=270;SM2.height=480;const SMX2=SM2.getContext('2d');
function glowLayer(c,fn,color,blur){FX.setTransform(1,0,0,1,0,0);FX.clearRect(0,0,W,H);FX.setTransform(c.getTransform());fn(FX);
  SMX.setTransform(1,0,0,1,0,0);SMX.globalCompositeOperation='source-over';SMX.clearRect(0,0,270,480);SMX.drawImage(figC,0,0,270,480);SMX.globalCompositeOperation='source-in';SMX.fillStyle=color;SMX.fillRect(0,0,270,480);
  SMX2.clearRect(0,0,270,480);SMX2.filter=`blur(${blur/4}px)`;SMX2.drawImage(SM,0,0);SMX2.drawImage(SM,0,0);SMX2.filter='none';
  c.save();c.setTransform(1,0,0,1,0,0);c.drawImage(SM2,0,0,W,H);c.drawImage(figC,0,0);c.restore();}
const SF=document.createElement('canvas');SF.width=270;SF.height=480;const SFX=SF.getContext('2d');
function softLayer(c,fn){const m=c.getTransform();SFX.setTransform(1,0,0,1,0,0);SFX.clearRect(0,0,270,480);SFX.setTransform(m.a/4,m.b/4,m.c/4,m.d/4,m.e/4,m.f/4);fn(SFX);c.save();c.setTransform(1,0,0,1,0,0);c.imageSmoothingQuality='high';c.drawImage(SF,0,0,W,H);c.restore();}
// walk cycle
function walk(ph,amp=20){const s=Math.sin(ph);return[[amp*s,-6-34*Math.max(0,Math.sin(ph+1.3))],[-amp*s,-6-34*Math.max(0,Math.sin(ph+1.3+Math.PI))]];}
// ---------- scenery helpers ----------
function ridge(c,y,amp,seed,col,x0=-600,x1=1700){const r=rng(seed),f=[r()*.004+.002,r()*.01+.006,r()*.02+.015],p=[r()*9,r()*9,r()*9];c.fillStyle=col;c.beginPath();c.moveTo(x0,H+400);for(let x=x0;x<=x1;x+=12){c.lineTo(x,y-amp*(.55*Math.sin(x*f[0]+p[0])+.3*Math.sin(x*f[1]+p[1])+.15*Math.sin(x*f[2]+p[2])));}c.lineTo(x1,H+400);c.fill();}
function grass(c,x0,x1,yf,hh,dens,seed,t,col){const r=rng(seed);c.strokeStyle=col;c.lineCap='round';for(let x=x0;x<x1;x+=dens){const bx=x+r()*dens,y=yf(bx),h=hh*(.4+r()),sw=Math.sin(t*1.3+bx*.02)*h*.12+(r()-.5)*h*.5;c.lineWidth=1.5+r()*2.5;c.beginPath();c.moveTo(bx,y+2);c.quadraticCurveTo(bx+sw*.3,y-h*.6,bx+sw,y-h);c.stroke();}}
function tree(c,x,y,s,seed,t,col,blossom){const r=rng(seed);c.fillStyle=col;c.strokeStyle=col;c.lineCap='round';const sway=Math.sin(t*.9+seed)*.025;
  const br=(x0,y0,a,len,w,dep)=>{const a2=a+sway*(5-dep);const x1=x0+Math.sin(a2)*len,y1=y0-Math.cos(a2)*len;c.lineWidth=w;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();if(dep<=0){for(let i=0;i<5;i++){c.beginPath();c.arc(x1+(r()-.5)*len*1.6,y1+(r()-.5)*len*1.2,len*(.35+r()*.45),0,7);c.fill();}return;}const n=2+(r()<.4?1:0);for(let i=0;i<n;i++)br(x1,y1,a2+(r()-.5)*1.3,len*(.62+r()*.2),w*.62,dep-1);};
  br(x,y,(r()-.5)*.1,s*.32,s*.06,4);}
function glow(c,x,y,r,col,a){c.save();c.globalCompositeOperation='lighter';const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col.replace('A',a));g.addColorStop(.4,col.replace('A',a*.35));g.addColorStop(1,col.replace('A',0));c.fillStyle=g;c.fillRect(x-r,y-r,2*r,2*r);c.restore();}
function vgrad(c,y0,y1,stops,x0=-800,x1=W+800){const g=c.createLinearGradient(0,y0,0,y1);stops.forEach(([o,cl])=>g.addColorStop(o,cl));c.fillStyle=g;c.fillRect(x0,y0,x1-x0,y1-y0);}
const STARS=(()=>{const r=rng(7),a=[];for(let i=0;i<220;i++)a.push({x:r()*1600-260,y:r()*1300-200,s:r()*1.8+.4,p:r()*9,f:.5+r()*2});return a;})();
function stars(c,t,alpha){c.save();c.globalCompositeOperation='lighter';for(const s of STARS){const a=alpha*(.45+.55*Math.sin(t*s.f+s.p));if(a<=0)continue;c.fillStyle=`rgba(220,230,255,${a})`;c.beginPath();c.arc(s.x,s.y,s.s,0,7);c.fill();}c.restore();}
const MOTES=(()=>{const r=rng(11),a=[];for(let i=0;i<70;i++)a.push({x:r()*1300-110,y:r()*1900,s:r()*3+1,p:r()*9,v:8+r()*20});return a;})();
function motes(c,t,col,alpha,yMin=0){c.save();c.globalCompositeOperation='lighter';for(const m of MOTES){const y=((m.y-m.v*t)%1900+1900)%1900;if(y<yMin)continue;const x=m.x+Math.sin(t*.7+m.p)*18;const a=alpha*(.5+.5*Math.sin(t*1.5+m.p));c.fillStyle=col.replace('A',a);c.beginPath();c.arc(x,y,m.s,0,7);c.fill();}c.restore();}
function water(c,x0,x1,y0,y1,t,seed,cols,colAt){const r=rng(seed);c.save();c.globalCompositeOperation='lighter';for(let i=0;i<260;i++){const y=y0+Math.pow(r(),1.3)*(y1-y0),x=x0+r()*(x1-x0),w=(8+r()*50)*(.4+(y-y0)/(y1-y0)),ph=r()*9,sp=1+r()*2.5;const a=Math.max(0,Math.sin(t*sp+ph))*colAt(x,y);if(a<.01)continue;c.strokeStyle=cols.replace('A',a);c.lineWidth=1.5+(y-y0)/(y1-y0)*2.5;c.beginPath();c.moveTo(x-w/2+Math.sin(t+ph)*6,y);c.lineTo(x+w/2+Math.sin(t+ph)*6,y);c.stroke();}c.restore();}
function railing(c,x0,x1,y,hh,col){c.strokeStyle=col;c.fillStyle=col;c.lineWidth=7;c.beginPath();c.moveTo(x0,y-hh);c.lineTo(x1,y-hh);c.moveTo(x0,y-6);c.lineTo(x1,y-6);c.stroke();c.lineWidth=3.5;for(let x=x0;x<x1;x+=46){c.beginPath();c.moveTo(x,y-hh);c.lineTo(x,y);c.stroke();c.beginPath();c.ellipse(x+23,y-hh/2,13,hh*.32,0,0,7);c.stroke();c.beginPath();c.arc(x+23,y-hh/2,4,0,7);c.fill();}}

// ================= palette helpers =================
const mixc=(a,b,k)=>a.map((v,i)=>Math.round(lerp(v,b[i],k)));
const rgb=(a,al=1)=>`rgba(${a[0]},${a[1]},${a[2]},${al})`;
const ORBS=(()=>{const r=rng(77),a=[];const cols=[[255,70,140],[255,190,80],[170,90,255],[255,90,70],[80,200,255],[255,140,200]];for(let i=0;i<16;i++)a.push({r:120+r()*260,a:r()*6.28,s:(r()<.5?-1:1)*(.25+r()*.5),y:-80+r()*-260,z:.6+r()*.8,c:cols[i%cols.length],p:r()*9,size:14+r()*22});return a;})();
function orb(c,x,y,rad,col,a){c.save();c.globalCompositeOperation='lighter';const g=c.createRadialGradient(x,y,0,x,y,rad*3.2);g.addColorStop(0,rgb(col,.95*a));g.addColorStop(.18,rgb(col,.55*a));g.addColorStop(1,rgb(col,0));c.fillStyle=g;c.fillRect(x-rad*3.2,y-rad*3.2,rad*6.4,rad*6.4);c.fillStyle=`rgba(255,255,255,${.85*a})`;c.beginPath();c.arc(x,y,rad*.32,0,7);c.fill();c.restore();}
function oldPose(F,k,t){ // blend any standing pose toward an old bent man with cane
  F.lean=lerp(F.lean||0,26,k);F.head=lerp(F.head||0,-14,k);
  F.legs=F.legs.map(([a,b],i)=>[lerp(a,i?-4:16,k),lerp(b,i?-16:-26,k)]);F.cane=k;return F;}

// ================= S1: he leaves home, father reaches out =================
function S1(c,t){
  const d=drift(t),sx=K(t,[[0,430],[4.4,720]]);
  const C={cx:K(t,[[0,520],[4.4,600]])+d.dx,cy:960+d.dy,z:K(t,[[0,1],[4.4,1.08]]),r:d.r,bz:1.28,bx:520,by:1150};
  cam(c,C,0);vgrad(c,-300,1300,[[0,'#121528'],[.45,'#2b2446'],[.8,'#6b3a5e'],[1,'#b0577a']]);
  cam(c,C,.03);stars(c,t,.45);glow(c,980,1260,700,'rgba(255,60,150,A)',.45+.08*Math.sin(t*3));glow(c,1100,1250,380,'rgba(80,180,255,A)',.25);
  cam(c,C,.18);(function(){const r=rng(19);c.fillStyle='#120f1d';for(let i=0;i<26;i++){const x=640+i*42+r()*20,w=30+r()*40,h=80+r()*260;c.fillRect(x,1300-h,w,h+60);}const r2=rng(23);c.save();c.globalCompositeOperation='lighter';for(let i=0;i<160;i++){const x=640+r2()*1150,y=1300-r2()*300;c.fillStyle=`rgba(255,${150+r2()*100|0},${120+r2()*120|0},${.35+.3*Math.sin(t*2+i)})`;c.fillRect(x,y,3,4);}c.restore();})();
  cam(c,C,.4);ridge(c,1330,14,4,'#1a1424');
  cam(c,C,1);c.fillStyle='#0d0a10';c.fillRect(-600,1420,2600,900);
  // house
  c.fillStyle='#0d0a10';c.beginPath();c.moveTo(-500,1422);c.lineTo(-500,840);c.lineTo(-60,700);c.lineTo(340,840);c.lineTo(340,1422);c.fill();
  vgrad(c,1030,1422,[[0,'#ffcf8a'],[1,'#ff9f5a']],120,290);glow(c,205,1240,560,'rgba(255,160,80,A)',.55);
