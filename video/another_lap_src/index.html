<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1080, H = 1920, DUR = 12.1;
const AF = await (await fetch('./audio_feat.json')).json();
const af = (k, t) => { const i = Math.min(AF[k].length - 1, Math.max(0, Math.round(t * AF.fps))); return AF[k][i]; };
const afSmooth = (k, t, win = 3) => { let s = 0, n = 0; for (let d = -win; d <= win; d++) { s += af(k, t + d / AF.fps) * (win + 1 - Math.abs(d)); n += win + 1 - Math.abs(d); } return s / n; };

// ---------- helpers ----------
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * t * (t * (t * 6 - 15) + 10); };
const lerp = (a, b, k) => a + (b - a) * k;
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

// ---------- Möbius road math ----------
const R = 60, RW = 9.0, THK = 0.25, LANE = -2.2;
const CIRC = 2 * Math.PI * R, FULL = 2 * CIRC;   // s in [0, FULL) covers both faces
function center(u) { return V3(R * Math.cos(u), 5 * Math.sin(2 * u + 0.6), R * Math.sin(u)); }
function frame(s) { // returns {C,T,W,N}
  const u = s / R, e = 1e-3;
  const C = center(u), T = center(u + e).sub(center(u - e)).normalize();
  const th = u / 2, rad = V3(Math.cos(u), 0, Math.sin(u));
  const Wv = rad.clone().multiplyScalar(Math.cos(th)).add(V3(0, Math.sin(th), 0));
  Wv.sub(T.clone().multiplyScalar(Wv.dot(T))).normalize();
  const N = V3().crossVectors(T, Wv).normalize();
  return { C, T, W: Wv, N };
}
function surf(s, v, h = 0) { const f = frame(s); return f.C.clone().addScaledVector(f.W, v).addScaledVector(f.N, THK + h); }

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const FOGC = new THREE.Color().setRGB(0.0105, 0.0135, 0.019);
scene.background = FOGC.clone();
scene.fog = new THREE.FogExp2(FOGC, 0.03);
const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 3000);
const U = { fogD: { value: 0.03 }, fogC: { value: FOGC }, time: { value: 0 }, bass: { value: 0 } };

// lamps
const NL = 44, DL = FULL / NL, LH = 7.2, LV = RW / 2 + 0.9;
const lampBulb = [], lampDir = [];
const lampTex = new Float32Array(NL * 4 * 2);
for (let k = 0; k < NL; k++) {
  const s = k * DL + DL * 0.5, f = frame(s);
  const base = surf(s, LV, 0);
  const top = base.clone().addScaledVector(f.N, LH);
  const bulb = top.clone().addScaledVector(f.W, -2.6).addScaledVector(f.N, -0.25);
  lampBulb.push(bulb); lampDir.push(f.N.clone().multiplyScalar(-1).addScaledVector(f.W, -0.15).normalize());
  lampTex.set([bulb.x, bulb.y, bulb.z, 1], k * 4);
  lampTex.set([lampDir[k].x, lampDir[k].y, lampDir[k].z, 1], (NL + k) * 4);
}
const lampDT = new THREE.DataTexture(lampTex, NL, 2, THREE.RGBAFormat, THREE.FloatType); lampDT.needsUpdate = true;

// ---------- road ----------
const GLSL_FOG = `
uniform float fogD; uniform vec3 fogC;
vec3 applyFog(vec3 c, float d){ float f = 1.0 - exp(-fogD*fogD*d*d); return mix(c, fogC, clamp(f,0.0,1.0)); }`;
const GLSL_HASH = `
float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }`;
{
  const NS = 2400, NV = 10;
  const pos = [], nor = [], sv = [], idx = [];
  for (let i = 0; i <= NS; i++) {
    const s = i / NS * FULL, f = frame(s);
    for (let j = 0; j <= NV; j++) {
      const v = -RW / 2 + RW * j / NV;
      const p = f.C.clone().addScaledVector(f.W, v).addScaledVector(f.N, THK);
      pos.push(p.x, p.y, p.z); nor.push(f.N.x, f.N.y, f.N.z); sv.push(s, v);
    }
  }
  for (let i = 0; i < NS; i++) for (let j = 0; j < NV; j++) {
    const a = i * (NV + 1) + j, b = a + NV + 1;
    idx.push(a, b, a + 1, a + 1, b, b + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('sv', new THREE.Float32BufferAttribute(sv, 2));
  g.setIndex(idx);
  const roadMat = new THREE.ShaderMaterial({
    uniforms: { ...U, lamps: { value: lampDT }, carS: { value: 0 }, carV: { value: LANE }, carP: { value: V3() }, carT: { value: V3() }, camP: { value: V3() }, flash: { value: 0 } },
    vertexShader: `
      attribute vec2 sv; varying vec2 vSV; varying vec3 vP; varying vec3 vN;
      void main(){ vSV = sv; vec4 wp = modelMatrix*vec4(position,1.0); vP = wp.xyz; vN = normal;
        gl_Position = projectionMatrix*viewMatrix*wp; }`,
    fragmentShader: `
      precision highp float;
      uniform sampler2D lamps; uniform float carS, carV, time, bass, flash; uniform vec3 carP, carT, camP;
      varying vec2 vSV; varying vec3 vP; varying vec3 vN;
      ${GLSL_FOG}${GLSL_HASH}
      const float NL = ${NL.toFixed(1)}; const float DL = ${DL.toFixed(5)}; const float FULL = ${FULL.toFixed(5)};
      vec3 lampB(float k){ return texture2D(lamps, vec2((mod(k,NL)+0.5)/NL, 0.25)).xyz; }
      vec3 lampD(float k){ return texture2D(lamps, vec2((mod(k,NL)+0.5)/NL, 0.75)).xyz; }
      void main(){
        float s = vSV.x, v = vSV.y;
        vec3 N = normalize(vN); vec3 V = normalize(camP - vP);
        if(dot(N,V) < 0.0) N = -N;
        // asphalt
        vec2 q = vec2(s*1.3, v*1.3);
        float n1 = vnoise(q*3.0), n2 = vnoise(q*17.0), n3 = vnoise(q*0.35);
        vec3 base = vec3(0.028,0.03,0.034) * (0.75 + 0.35*n1 + 0.2*n2) * (0.85+0.3*n3);
        float wet = 0.35 + 0.65*smoothstep(0.3, 0.8, vnoise(q*0.25 + 11.0));      // puddles
        // markings
        float dash = step(0.0, sin(s*0.42)) * (1.0 - smoothstep(0.07, 0.12, abs(v)));
        float edge = 1.0 - smoothstep(0.08, 0.14, abs(abs(v) - (${(RW / 2 - 0.45).toFixed(2)})));
        float paint = max(dash, edge) * (0.55 + 0.45*n2) * (1.0 - wet*0.4);
        base = mix(base, vec3(0.42,0.42,0.40), paint);
        // lamps
        float k0 = floor((s - DL*0.5)/DL + 0.5);
        vec3 col = base * 0.12;
        for(int i=-1;i<=1;i++){
          float k = k0 + float(i);
          vec3 B = lampB(k), D = lampD(k);
          vec3 L = B - vP; float d = length(L); L /= d;
          float spot = smoothstep(0.35, 0.85, dot(-L, D));
          float diff = max(dot(N, L), 0.0);
          float att = 60.0 / (1.0 + d*d*0.9);
          vec3 lc = vec3(0.86,0.9,1.0) * (1.0 + 0.25*bass);
          col += base * lc * diff * att * spot * 1.6;
          vec3 Hh = normalize(L + V);
          float rough = mix(0.35, 0.06, wet);
          float sp = pow(max(dot(N,Hh),0.0), 2.0/(rough*rough)) * (0.15 + 1.4*wet);
          float fr = 0.04 + 0.96*pow(1.0 - max(dot(N,V),0.0), 5.0);
          col += lc * sp * att * spot * fr * 0.7;
        }
        // car lights on the road
        float ds = s - carS; ds = mod(ds + FULL*0.5, FULL) - FULL*0.5;
        float tail = exp(-pow((ds + 3.0)/1.3, 2.0) - pow((v - carV)/1.0, 2.0));
        col += vec3(1.0,0.05,0.03) * tail * (0.006 + 0.03*wet);
        float ahead = ds - 2.6;
        float beam = step(0.0, ahead) * exp(-ahead/28.0) * exp(-pow((v - carV)/(0.9 + ahead*0.32), 2.0)) * smoothstep(0.0, 4.0, ahead);
        col += vec3(0.95,0.97,1.0) * beam * (0.55 + 1.2*wet) * base * 14.0 + vec3(0.9,0.95,1.0)*beam*wet*0.03;
        // gate flash pools
        float gd = min(abs(mod(s, ${CIRC.toFixed(4)}) ), abs(mod(s, ${CIRC.toFixed(4)}) - ${CIRC.toFixed(4)}));
        col += vec3(0.8,0.85,1.0) * exp(-gd*gd/18.0) * (0.06 + 0.5*flash) * (0.3+wet);
        float dist = length(camP - vP);
        gl_FragColor = vec4(applyFog(col, dist), 1.0);
      }`,
    side: THREE.DoubleSide
  });
  const road = new THREE.Mesh(g, roadMat); road.frustumCulled = false; scene.add(road);
  window._roadMat = roadMat;
  // edge walls (single Möbius edge)
  const ep = [], ei = [];
  for (let i = 0; i <= NS; i++) {
    const s = i / NS * FULL, f = frame(s);
    const a = f.C.clone().addScaledVector(f.W, RW / 2).addScaledVector(f.N, THK);
    const b = f.C.clone().addScaledVector(f.W, RW / 2).addScaledVector(f.N, -THK);
    ep.push(a.x, a.y, a.z, b.x, b.y, b.z);
    if (i < NS) { const o = i * 2; ei.push(o, o + 1, o + 2, o + 1, o + 3, o + 2); }
  }
  const eg = new THREE.BufferGeometry(); eg.setAttribute('position', new THREE.Float32BufferAttribute(ep, 3)); eg.setIndex(ei); eg.computeVertexNormals();
  const edge = new THREE.Mesh(eg, new THREE.MeshStandardMaterial({ color: 0x15171b, roughness: 0.7, metalness: 0.2, side: THREE.DoubleSide }));
  edge.frustumCulled = false; scene.add(edge);
  // reflective edge strip (cat's-eye line along the single edge)
  const sp = [], si = [];
  for (let i = 0; i <= NS; i++) {
    const s = i / NS * FULL, f = frame(s);
    const a = f.C.clone().addScaledVector(f.W, RW / 2 + 0.02).addScaledVector(f.N, 0.05);
    const b = f.C.clone().addScaledVector(f.W, RW / 2 + 0.02).addScaledVector(f.N, -0.05);
    sp.push(a.x, a.y, a.z, b.x, b.y, b.z);
    if (i < NS) { const o = i * 2; si.push(o, o + 1, o + 2, o + 1, o + 3, o + 2); }
  }
  const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3)); sg.setIndex(si);
  scene.add(Object.assign(new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ color: new THREE.Color(0.9, 0.12, 0.08), side: THREE.DoubleSide, fog: true })), { frustumCulled: false }));
}

// ---------- environment map (for glossy car paint) ----------
{
  const c = document.createElement('canvas'); c.width = 512; c.height = 256; const x = c.getContext('2d');
  const gr = x.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#0d1118'); gr.addColorStop(0.5, '#1a1f28'); gr.addColorStop(1, '#030304');
  x.fillStyle = gr; x.fillRect(0, 0, 512, 256);
  for (let i = 0; i < 14; i++) { const px = (i * 37) % 512, py = 70 + (i * 13) % 30; const rg = x.createRadialGradient(px, py, 0, px, py, 18); rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = rg; x.fillRect(px - 20, py - 20, 40, 40); }
  x.fillStyle = 'rgba(200,215,255,0.5)'; x.fillRect(0, 118, 512, 4);
  const tex = new THREE.CanvasTexture(c); tex.mapping = THREE.EquirectangularReflectionMapping; tex.colorSpace = THREE.SRGBColorSpace;
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromEquirectangular(tex).texture;
}
scene.add(new THREE.HemisphereLight(0x223044, 0x050505, 0.35));

// ---------- lamp posts (instanced) ----------
const poleMat = new THREE.MeshStandardMaterial({ color: 0x2a2d33, roughness: 0.45, metalness: 0.7, envMapIntensity: 0.6 });
const poleG = new THREE.CylinderGeometry(0.11, 0.15, LH, 8); poleG.translate(0, LH / 2, 0);
const armG = new THREE.BoxGeometry(0.12, 0.12, 2.9); armG.translate(0, LH - 0.06, -1.35);
const headG = new THREE.BoxGeometry(0.45, 0.16, 1.0); headG.translate(0, LH - 0.12, -2.55);
const bulbG = new THREE.BoxGeometry(0.34, 0.03, 0.8); bulbG.translate(0, LH - 0.215, -2.55);
const IM = (geo, mat) => { const m = new THREE.InstancedMesh(geo, mat, NL); m.frustumCulled = false; scene.add(m); return m; };
const poles = IM(poleG, poleMat), arms = IM(armG, poleMat), heads = IM(headG, poleMat);
const bulbs = IM(bulbG, new THREE.MeshBasicMaterial({ color: new THREE.Color(3.2, 3.4, 3.8), toneMapped: false, fog: false }));
{
  const m = new THREE.Matrix4();
  for (let k = 0; k < NL; k++) {
    const s = k * DL + DL * 0.5, f = frame(s), base = surf(s, LV, 0);
    // local: y = N (up), z = W (arm points to -z => toward road), x = cross
    const X = V3().crossVectors(f.N, f.W);
    m.makeBasis(X, f.N, f.W).setPosition(base);
    poles.setMatrixAt(k, m); arms.setMatrixAt(k, m); heads.setMatrixAt(k, m); bulbs.setMatrixAt(k, m);
  }
}

// halos + light cones (billboards / additive)
const haloMat = new THREE.ShaderMaterial({
  uniforms: { ...U, sizeA: { value: 1 } },
  vertexShader: `
    attribute vec3 iPos; attribute float iSize; attribute float iInt;
    varying vec2 vUv; varying float vI; varying float vD;
    void main(){ vUv = position.xy; vI = iInt;
      vec4 mv = viewMatrix*vec4(iPos,1.0); vD = -mv.z;
      mv.xy += position.xy * iSize; gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `
    uniform float fogD, bass; varying vec2 vUv; varying float vI; varying float vD;
    void main(){ float r = length(vUv); if(r>1.0) discard;
      float g = exp(-r*r*7.0)*0.9 + exp(-r*3.2)*0.25;
      float fogA = exp(-fogD*fogD*vD*vD*0.35);
      vec3 c = vec3(0.82,0.88,1.0) * g * vI * (1.0+0.35*bass) * fogA;
      gl_FragColor = vec4(c, 1.0); }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});
function billboards(list) {
  const g = new THREE.InstancedBufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([-1, -1, 0, 1, -1, 0, 1, 1, 0, -1, 1, 0], 3)); g.setIndex([0, 1, 2, 0, 2, 3]);
  const p = [], s = [], it = [];
  for (const b of list) { p.push(b.p.x, b.p.y, b.p.z); s.push(b.s); it.push(b.i); }
  g.setAttribute('iPos', new THREE.InstancedBufferAttribute(new Float32Array(p), 3));
  g.setAttribute('iSize', new THREE.InstancedBufferAttribute(new Float32Array(s), 1));
  g.setAttribute('iInt', new THREE.InstancedBufferAttribute(new Float32Array(it), 1));
  g.instanceCount = list.length;
  const m = new THREE.Mesh(g, haloMat); m.frustumCulled = false; scene.add(m); return m;
}
billboards([...lampBulb.map(p => ({ p, s: 1.6, i: 0.9 })), ...lampBulb.map(p => ({ p, s: 7.0, i: 0.09 }))]);
// volumetric cones
{
  const cg = new THREE.ConeGeometry(4.2, LH, 32, 1, true); cg.translate(0, -LH / 2, 0);
  const cm = new THREE.ShaderMaterial({
    uniforms: { ...U, camP: { value: V3() } },
    vertexShader: `varying float vY; varying vec3 vN; varying vec3 vP;
      void main(){ vY = -position.y/${LH.toFixed(2)}; vec4 wp = modelMatrix*instanceMatrix*vec4(position,1.0); vP = wp.xyz;
        vN = normalize(mat3(modelMatrix*instanceMatrix)*normal); gl_Position = projectionMatrix*viewMatrix*wp; }`,
    fragmentShader: `uniform vec3 camP; uniform float fogD, bass; varying float vY; varying vec3 vN; varying vec3 vP;
      void main(){ vec3 V = normalize(camP - vP); float e = abs(dot(normalize(vN), V));
        float a = pow(e, 1.6) * pow(1.0 - vY, 1.3) * 0.04 * (1.0+0.4*bass);
        float d = length(camP - vP); a *= exp(-fogD*fogD*d*d*0.5);
        gl_FragColor = vec4(vec3(0.8,0.86,1.0)*a, 1.0); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide
  });
  const cones = new THREE.InstancedMesh(cg, cm, NL); cones.frustumCulled = false;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion();
  for (let k = 0; k < NL; k++) {
    q.setFromUnitVectors(V3(0, 1, 0), lampDir[k].clone().multiplyScalar(-1));
    m.compose(lampBulb[k], q, V3(1, 1, 1)); cones.setMatrixAt(k, m);
  }
  scene.add(cones); window._coneMat = cm;
}

// ---------- lap gates (at s = 0 and s = CIRC: same physical spot, both faces) ----------
const gateLightMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(2.5, 2.7, 3.2), toneMapped: false });
const gateGroup = new THREE.Group(); scene.add(gateGroup);
{
  const f = frame(0), p0 = f.C;
  const X = V3().crossVectors(f.N, f.W);
  const g = new THREE.Group();
  const m = new THREE.Matrix4().makeBasis(f.W, f.N, X.clone().multiplyScalar(-1)).setPosition(p0);
  g.applyMatrix4(m);
  const half = RW / 2 + 1.2, ht = 6.8;
  const post = new THREE.BoxGeometry(0.35, ht * 2, 0.35);
  for (const sx of [-1, 1]) { const b = new THREE.Mesh(post, poleMat); b.position.set(sx * half, 0, 0); g.add(b); }
  const bar = new THREE.BoxGeometry(half * 2 + 0.35, 0.45, 0.45);
  for (const sy of [-1, 1]) {
    const b = new THREE.Mesh(bar, poleMat); b.position.set(0, sy * ht, 0); g.add(b);
    for (let i = 0; i < 9; i++) { const l = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.06, 0.3), gateLightMat); l.position.set(-half + 0.9 + i * (2 * half - 1.8) / 8, sy * (ht - 0.26), 0); g.add(l); }
  }
  gateGroup.add(g);
  const gp = []; for (let i = 0; i < 9; i++) for (const sy of [-1, 1]) gp.push({ p: p0.clone().addScaledVector(f.W, -half + 0.9 + i * (2 * half - 1.8) / 8).addScaledVector(f.N, sy * (ht - 0.5)), s: 1.6, i: 1.0 });
  window._gateHalos = billboards(gp);
}

// ---------- the car ----------
const car = new THREE.Group(); scene.add(car);
const plateCanvas = document.createElement('canvas'); plateCanvas.width = 512; plateCanvas.height = 112;
const plateTex = new THREE.CanvasTexture(plateCanvas); plateTex.colorSpace = THREE.SRGBColorSpace; plateTex.anisotropy = 8;
let plateShown = -1;
function drawPlate(n) {
  if (n === plateShown) return; plateShown = n;
  const x = plateCanvas.getContext('2d');
  x.fillStyle = '#e9e6dc'; x.fillRect(0, 0, 512, 112);
  x.fillStyle = '#1d3f9a'; x.fillRect(0, 0, 54, 112);
  x.fillStyle = '#f2d44a'; x.font = '600 18px Inter'; x.textAlign = 'center'; x.fillText('★', 27, 40); x.fillStyle = '#fff'; x.font = '700 24px Inter'; x.fillText('L', 27, 90);
  x.fillStyle = '#121212'; x.font = '700 78px "Inter Display", Inter'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('AGAIN ' + String(n).padStart(2, '0'), 284, 60);
  x.strokeStyle = '#121212'; x.lineWidth = 4; x.strokeRect(2, 2, 508, 108);
  plateTex.needsUpdate = true;
}
{
  const sh = new THREE.Shape();
  sh.moveTo(-2.36, 0.34); sh.lineTo(-1.98, 0.34);
  sh.absarc(-1.5, 0.36, 0.48, Math.PI, 0, true);
  sh.lineTo(1.02, 0.34); sh.absarc(1.5, 0.36, 0.48, Math.PI, 0, true);
  sh.lineTo(2.36, 0.34); sh.lineTo(2.44, 0.6); sh.quadraticCurveTo(2.42, 0.82, 2.0, 0.88);

const SPEED = CIRC / 8.5;

function rigHero(t) {          // 0–6: tight on the tail-light strip, pulling back
